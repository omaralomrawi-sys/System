<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ID Print – طباعة المستمسكات</title>
<style>
:root{
  --bg:#eef0f4;--work:#e4e7ed;--panel:#ffffff;--panel2:#f5f6f9;--line:#e2e5eb;--ink:#14181f;--mut:#667085;
  --acc:#2563eb;--acc-ink:#fff;--acc-soft:#e8efff;--danger:#d92d20;--ok:#12a150;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.08);
  --pageshadow:0 2px 6px rgba(0,0,0,.18),0 12px 40px rgba(0,0,0,.18);--dots:rgba(0,0,0,.09)
}
[data-theme=dark]{
  --bg:#0c0e12;--work:#0a0b0e;--panel:#14171d;--panel2:#1b1f27;--line:#272c36;--ink:#e9ecf1;--mut:#8b94a5;
  --acc:#5b9bff;--acc-ink:#07111f;--acc-soft:#17243d;--danger:#ff6b60;--ok:#3ddc84;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.45);
  --pageshadow:0 0 0 1px rgba(255,255,255,.06),0 14px 50px rgba(0,0,0,.7);--dots:rgba(255,255,255,.07)
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Inter,"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,Arial,sans-serif;font-size:13.5px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
svg{flex:none}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:0 11px;height:32px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .12s,border-color .12s,box-shadow .12s}
button:hover{background:var(--panel2);border-color:color-mix(in srgb,var(--line),var(--ink) 18%)}
button:active{transform:translateY(.5px)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button.pri:hover{filter:brightness(1.08);background:var(--acc)}
button.dng{color:var(--danger)}
button.ico{width:32px;padding:0}
button:disabled{opacity:.4;cursor:default;pointer-events:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=number],input[type=text],input[type=search],select{border:1px solid var(--line);border-radius:8px;padding:0 9px;height:32px;background:var(--panel2);width:100%;min-width:0}
input:focus,select:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc),transparent 80%)}
label.l{display:block;font-size:11.5px;color:var(--mut);margin-bottom:4px;font-weight:500}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px}

#app{display:grid;grid-template-rows:52px 1fr 40px;height:100%}
header.top{direction:ltr;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.1px;margin-inline-end:6px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--panel);display:grid;place-items:center}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
header .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;height:30px}
.seg button+button{border-inline-start:1px solid var(--line)}

#main{direction:ltr;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
#work{position:relative;overflow:auto;padding:28px;background:var(--work);background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:18px 18px;min-width:0}
#work.over{box-shadow:inset 0 0 0 3px var(--acc)}
#pagebox{position:relative;margin:0}
.page{background:#fff;position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:var(--pageshadow);direction:ltr;overflow:hidden;border-radius:1px}
.mguide{position:absolute;border:1px dashed rgba(100,116,139,.35);pointer-events:none}
.frame{position:absolute;background:#fff;user-select:none;touch-action:none}
.frame.empty{background:linear-gradient(135deg,#f8fafc,#eef2f7);border-radius:1.6mm;box-shadow:inset 0 0 0 .35mm #b4c0d0;color:#475569;direction:rtl;text-align:center;display:flex;align-items:center;justify-content:center}
.frame.empty:hover{box-shadow:inset 0 0 0 .35mm #6b8cc7;background:linear-gradient(135deg,#f4f8ff,#e8f0fd)}
.frame .tag{position:absolute;top:1.6mm;inset-inline-start:1.6mm;font-size:2.7mm;font-weight:700;background:#1e293b;color:#fff;padding:.4mm 1.8mm;border-radius:5mm;line-height:1.5}
.frame .ph{display:flex;flex-direction:column;align-items:center;gap:.8mm;padding:2mm;pointer-events:none}
.frame .ph svg{width:9mm;height:9mm;color:#7b8ba3;stroke-width:1.5}
.frame .ph b{font-size:3.5mm;font-weight:700;color:#334155;line-height:1.3}
.frame .ph small{font-size:2.7mm;color:#7b8ba3;direction:ltr}
.frame .ph em{font-style:normal;font-size:2.5mm;color:#94a3b8}
.frame.sm .ph svg,.frame.sm .ph em,.frame.sm .add{display:none}
.frame .add{position:absolute;bottom:2mm;inset-inline-end:2mm;height:auto;font-size:2.8mm;padding:.7mm 2.4mm;border-radius:5mm;background:#fff;border:1px solid #9fb0c6;color:#1d4ed8;font-weight:600;gap:0}
.frame img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.frame:not(.empty):hover{outline:.4mm solid rgba(37,99,235,.55);outline-offset:.2mm}
.frame.sel{outline:.55mm solid #2563eb!important;outline-offset:.3mm;z-index:5}
.frame.dropt{outline:.9mm solid #12a150!important;outline-offset:.3mm}
.hd{position:absolute;width:3.2mm;height:3.2mm;background:#fff;border:.45mm solid #2563eb;border-radius:50%;z-index:10;box-shadow:0 .3mm 1mm rgba(0,0,0,.25)}
.hd[data-h=nw]{left:-1.6mm;top:-1.6mm;cursor:nwse-resize}.hd[data-h=n]{left:calc(50% - 1.6mm);top:-1.6mm;cursor:ns-resize}.hd[data-h=ne]{right:-1.6mm;top:-1.6mm;cursor:nesw-resize}
.hd[data-h=e]{right:-1.6mm;top:calc(50% - 1.6mm);cursor:ew-resize}.hd[data-h=se]{right:-1.6mm;bottom:-1.6mm;cursor:nwse-resize}.hd[data-h=s]{left:calc(50% - 1.6mm);bottom:-1.6mm;cursor:ns-resize}
.hd[data-h=sw]{left:-1.6mm;bottom:-1.6mm;cursor:nesw-resize}.hd[data-h=w]{left:-1.6mm;top:calc(50% - 1.6mm);cursor:ew-resize}
#ftb{position:absolute;display:none;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:20;direction:ltr}
#ftb button{height:30px;width:30px;padding:0;border:0;background:transparent;border-radius:7px}
#ftb button:hover{background:var(--acc-soft);color:var(--acc)}
#ftb button.dng:hover{background:color-mix(in srgb,var(--danger),transparent 88%);color:var(--danger)}
#ftb i{width:1px;background:var(--line);margin:4px 2px}

#panel{display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0}
html[dir=rtl] #panel{direction:rtl}html[dir=ltr] #panel{direction:ltr}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line)}
.tabs button{flex-direction:column;height:54px;gap:3px;border:0;border-radius:9px 9px 0 0;background:transparent;font-size:11.5px;color:var(--mut);border-bottom:2px solid transparent}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc);background:var(--acc-soft)}
.tabs button:hover{background:var(--panel2)}.tabs button.on:hover{background:var(--acc-soft)}
#pbody{flex:1;overflow:auto;padding:12px;min-height:0}
section[data-sec]{display:none}
h4{margin:16px 0 8px;font-size:11.5px;letter-spacing:.4px;color:var(--mut);font-weight:700}
h4:first-child{margin-top:0}
.row{display:flex;gap:8px;margin-bottom:10px}.row>div{flex:1;min-width:0}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hint{font-size:12px;color:var(--mut);line-height:1.65;margin:8px 0}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:10px}
.empty-state{text-align:center;padding:26px 14px;border:2px dashed var(--line);border-radius:14px;color:var(--mut)}
.empty-state>svg{width:34px;height:34px;color:var(--mut);margin-bottom:6px}
.empty-state b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{height:28px;border-radius:20px;font-size:12px;padding:0 11px;background:var(--panel2)}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12.5px;margin:8px 0}
.crumbs a{cursor:pointer;color:var(--acc);padding:2px 5px;border-radius:5px}.crumbs a:hover{background:var(--acc-soft)}
.crumbs span.cur{font-weight:600;padding:2px 5px}
.fbbar{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.fbbar input[type=search]{flex:1}
#fbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--ts,104px),1fr));gap:8px}
.tile{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--panel2);overflow:hidden;cursor:grab;display:flex;flex-direction:column}
.tile:hover{border-color:var(--acc);box-shadow:var(--shadow)}
.tile.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.tile .im{aspect-ratio:1;display:grid;place-items:center;background:repeating-conic-gradient(#0000000a 0 25%,transparent 0 50%) 0 0/14px 14px;color:var(--mut)}
.tile .im img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.tile .nm{font-size:11px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start;border-top:1px solid var(--line);background:var(--panel)}
.tile.dir{cursor:pointer}.tile.dir .im{background:none;color:#e0a526}
.tile .pdfb{position:absolute;top:4px;inset-inline-end:4px;background:#d92d20;color:#fff;font-size:9px;font-weight:700;border-radius:4px;padding:1px 4px}
#tray{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#tray .th{position:relative;border:1px solid var(--line);border-radius:8px;aspect-ratio:1;overflow:hidden;background:var(--panel2);cursor:grab}
#tray .th img{width:100%;height:100%;object-fit:contain;pointer-events:none}
#tray .th .x{position:absolute;top:2px;inset-inline-end:2px;width:18px;height:18px;padding:0;border-radius:50%;display:none;font-size:11px;line-height:1}
#tray .th:hover .x{display:flex}
.pl{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-bottom:7px;background:var(--panel)}
.pl:hover{border-color:color-mix(in srgb,var(--acc),var(--line) 50%)}
.pl .mini{width:46px;height:34px;display:grid;place-items:center;flex:none}
.pl .mini i{display:block;border:1.5px solid var(--mut);border-radius:3px;background:var(--panel2)}
.pl .tx{flex:1;min-width:0}.pl b{display:block;font-weight:600}.pl small{color:var(--mut);direction:ltr;unicode-bidi:embed}
.pl button{height:28px}
#props{border-top:1px solid var(--line);background:var(--panel);max-height:42%;overflow:auto;padding:10px 12px 12px}
#props h4{margin-top:0;display:flex;align-items:center;justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}#props .btns button{height:28px;font-size:12px;padding:0 8px}
.chk{display:flex;gap:7px;align-items:center;font-size:12.5px;margin:2px 0 8px}

footer.bar{direction:ltr;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-top:1px solid var(--line)}
footer .sp{flex:1}
#pages{display:flex;gap:4px}
#pages button{height:28px;font-size:12.5px;padding:0 11px}
#pages button.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc);font-weight:600}
#stat{font-size:12px;color:var(--mut)}#stat b{color:var(--ink)}
#zv{min-width:54px;height:28px}

#ctx{position:fixed;display:none;z-index:200;width:270px;max-width:90vw;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.28);padding:5px;font-size:13px}
html[dir=rtl] #ctx{direction:rtl}
#ctx button{width:100%;justify-content:flex-start;border:0;background:transparent;height:34px;border-radius:8px;gap:10px;padding:0 10px;color:var(--ink)}
#ctx button:hover{background:var(--acc-soft);color:var(--acc)}
#ctx button.dng{color:var(--danger)}#ctx button.dng:hover{background:color-mix(in srgb,var(--danger),transparent 88%)}
#ctx .sp2{height:1px;background:var(--line);margin:5px 4px}
#ctx .hh{font-size:11px;color:var(--mut);padding:6px 10px 3px;font-weight:700}
#toast{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 18px;border-radius:10px;z-index:300;display:none;max-width:80vw;box-shadow:var(--shadow)}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#modal .box{background:var(--panel);border-radius:16px;padding:16px;width:min(1020px,96vw);max-height:96vh;display:grid;grid-template-columns:1fr 240px;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
html[dir=rtl] #modal .box>div:last-child{direction:rtl}
#edwrap{position:relative;background:#111;display:flex;align-items:center;justify-content:center;min-height:300px;max-height:80vh;overflow:hidden;border-radius:10px;direction:ltr}
#edstage{position:relative;line-height:0}#edcv{display:block}
#crop{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;touch-action:none}
#crop i{position:absolute;width:14px;height:14px;background:#fff;border:2px solid #2563eb;border-radius:50%;touch-action:none}
#crop i[data-h=nw]{left:-8px;top:-8px;cursor:nwse-resize}#crop i[data-h=n]{left:calc(50% - 7px);top:-8px;cursor:ns-resize}#crop i[data-h=ne]{right:-8px;top:-8px;cursor:nesw-resize}
#crop i[data-h=e]{right:-8px;top:calc(50% - 7px);cursor:ew-resize}#crop i[data-h=se]{right:-8px;bottom:-8px;cursor:nwse-resize}#crop i[data-h=s]{left:calc(50% - 7px);bottom:-8px;cursor:ns-resize}
#crop i[data-h=sw]{left:-8px;bottom:-8px;cursor:nesw-resize}#crop i[data-h=w]{left:-8px;top:calc(50% - 7px);cursor:ew-resize}
#printRoot{display:none}
@media print{
  html,body{height:auto;background:#fff}
  #app,#toast,#modal,#ctx{display:none!important}
  #printRoot{display:block}
  .ppage{position:relative;overflow:hidden;page-break-after:always;break-after:page;direction:ltr}
  .ppage:last-child{page-break-after:auto;break-after:auto}
  .ppage .frame{position:absolute}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (max-width:900px){#main{grid-template-columns:1fr;grid-template-rows:60vh 1fr}}
</style>
</head>
<body>
<div id="app">
<header class="top">
  <div class="brand"><span class="logo"><i data-ic="card" data-s="17"></i></span><span data-i18n="title"></span></div>
  <div class="seg"><button class="ico" id="bUndo" data-tip="undo"><i data-ic="undo"></i></button><button class="ico" id="bRedo" data-tip="redo"><i data-ic="redo"></i></button></div>
  <span class="sp"></span>
  <button class="ico" id="bTheme"></button>
  <button id="bLang">EN</button>
  <span class="sep"></span>
  <button id="bPdf"><i data-ic="pdf"></i><span data-i18n="exportPdf"></span></button>
  <button id="bPrint" class="pri"><i data-ic="print"></i><span data-i18n="print"></span></button>
</header>

<div id="main">
  <div id="work"><div id="pagebox"><div class="page" id="page"></div><div id="ftb"></div></div></div>

  <div id="panel">
    <nav class="tabs">
      <button data-tab="files"><i data-ic="folder" data-s="19"></i><span data-i18n="tabFiles"></span></button>
      <button data-tab="tpl"><i data-ic="grid" data-s="19"></i><span data-i18n="tabTpl"></span></button>
      <button data-tab="page"><i data-ic="page" data-s="19"></i><span data-i18n="tabPage"></span></button>
      <button data-tab="lay"><i data-ic="layout" data-s="19"></i><span data-i18n="tabLay"></span></button>
    </nav>
    <div id="pbody">
      <section data-sec="files">
        <div id="fbintro"></div>
        <div id="fbview" style="display:none">
          <div class="crumbs" id="crumbs"></div>
          <div class="fbbar"><button class="ico" id="fbUp" data-tip="up"><i data-ic="up"></i></button><input type="search" id="fbq" data-ph="search"><button class="ico" id="fbRef" data-tip="refresh"><i data-ic="refresh"></i></button></div>
          <div class="fbbar"><i data-ic="image" data-s="14"></i><input type="range" id="fbsz" min="70" max="200" value="104"></div>
          <div id="fbgrid"></div>
        </div>
        <h4 style="margin-top:18px"><span data-i18n="added"></span> <span id="trayN"></span></h4>
        <div id="tray"></div>
        <p class="hint" data-i18n="trayHint"></p>
      </section>

      <section data-sec="tpl">
        <h4 data-i18n="addPairs"></h4>
        <div id="pairs"></div>
        <h4 data-i18n="singles"></h4>
        <div id="singles"></div>
        <h4 data-i18n="customSize"></h4>
        <div class="card">
          <div class="row"><div><label class="l" data-i18n="width"></label><input type="number" id="cw" value="85.6" step="0.1" min="5"></div>
          <div><label class="l" data-i18n="height"></label><input type="number" id="ch" value="54" step="0.1" min="5"></div></div>
          <div class="row"><div><label class="l" data-i18n="name"></label><input type="text" id="cn"></div></div>
          <div class="btns" style="margin:0"><button id="cAdd"><i data-ic="plus"></i><span data-i18n="addToPage"></span></button><button id="cSave"><i data-ic="pin"></i><span data-i18n="saveAsPreset"></span></button></div>
        </div>
        <p class="hint" data-i18n="resHint"></p>
      </section>

      <section data-sec="page">
        <div class="row">
          <div><label class="l" data-i18n="paper"></label><select id="paperSel"></select></div>
          <div><label class="l" data-i18n="orient"></label><select id="orient"><option value="p" data-i18n="portrait"></option><option value="l" data-i18n="landscape"></option></select></div>
        </div>
        <div class="row" id="customPaper" style="display:none">
          <div><label class="l" data-i18n="width"></label><input type="number" id="pw" value="210" min="30"></div>
          <div><label class="l" data-i18n="height"></label><input type="number" id="ph" value="297" min="30"></div>
        </div>
        <div class="row">
          <div><label class="l" data-i18n="margin"></label><input type="number" id="margin" value="5" min="0" step="1"></div>
          <div><label class="l" data-i18n="gap"></label><input type="number" id="gap" value="4" min="0" step="1"></div>
          <div><label class="l" data-i18n="snap"></label><select id="snap"><option value="0" data-i18n="off"></option><option value="0.5">0.5</option><option value="1" selected>1</option><option value="5">5</option></select></div>
        </div>
        <div class="btns"><button id="bArrange"><i data-ic="grid"></i><span data-i18n="autoArrange"></span></button><button id="bClear" class="dng"><i data-ic="trash"></i><span data-i18n="clearPage"></span></button></div>
        <h4 data-i18n="duplex"></h4>
        <div class="row"><div><label class="l" data-i18n="flipEdge"></label><select id="flip"><option value="long" data-i18n="longEdge"></option><option value="short" data-i18n="shortEdge"></option></select></div></div>
        <div class="btns"><button id="bMirror"><i data-ic="swap"></i><span data-i18n="mirrorPage"></span></button></div>
        <p class="hint" data-i18n="duplexHint"></p>
        <p class="hint" data-i18n="printHint"></p>
      </section>

      <section data-sec="lay">
        <h4 data-i18n="defLayout"></h4>
        <div class="card">
          <div class="btns" style="margin:0"><button id="bPin" class="pri"><i data-ic="pin"></i><span data-i18n="pinDefault"></span></button><button id="bResetDef"><i data-ic="refresh"></i><span data-i18n="resetDefault"></span></button></div>
          <p class="hint" style="margin-bottom:0" id="pinState"></p>
        </div>
        <h4 data-i18n="myLayouts"></h4>
        <div class="row"><div><input type="text" id="ln" data-ph="layName"></div><button id="lSave" class="pri" style="flex:none"><span data-i18n="save"></span></button></div>
        <div id="lays"></div>
        <h4 data-i18n="file"></h4>
        <div class="btns"><button id="lExport"><i data-ic="pdf"></i><span data-i18n="exportJson"></span></button><button id="lImport"><i data-ic="folder"></i><span data-i18n="importJson"></span></button></div>
        <label class="chk"><input type="checkbox" id="lImgs"> <span data-i18n="withImages"></span></label>
        <p class="hint" data-i18n="layHint"></p>

const item=id=>page().items.find(i=>i.id===id);
const selItem=()=>S.sel?item(S.sel):null;

const partner=it=>it&&it.pair?page().items.find(o=>o.pair===it.pair&&o.id!==it.id):null;

function stateJson(){return JSON.stringify({paper:S.paper,margin:S.margin,gap:S.gap,flip:S.flip,pages:S.pages,cur:S.cur});}
function hist(){undoS.push(stateJson());if(undoS.length>100)undoS.shift();redoS.length=0;}

function undo(){if(!undoS.length)return;redoS.push(stateJson());restore(undoS.pop());}
function redo(){if(!redoS.length)return;undoS.push(stateJson());restore(redoS.pop());}

/* ================= placing frames ================= */
function newItem(w,h,label,img){return {id:uid(),x:0,y:0,w:r1(w),h:r1(h),img:img||null,fit:'contain',border:0.2,bstyle:'solid',label:label||'',lock:false,pair:null,side:null};}
const overlaps=(a,b,g)=>a.x<b.x+b.w+g&&a.x+a.w+g>b.x&&a.y<b.y+b.h+g&&a.y+a.h+g>b.y;
function findSpot(items,w,h){
  const m=S.margin,g=S.gap,W=PW(),H=PH();
  for(let y=m;y+h<=H-m+0.01;y+=1)for(let x=m;x+w<=W-m+0.01;x+=1){const c={x,y,w,h};if(!items.some(o=>overlaps(c,o,g)))return{x,y};}
  return null;
}
function place(it){
  let sp=findSpot(page().items,it.w,it.h),np=false;
  if(!sp){S.pages.splice(S.cur+1,0,{items:[]});S.cur++;np=true;sp=findSpot([],it.w,it.h)||{x:S.margin,y:S.margin};}
  it.x=sp.x;it.y=sp.y;page().items.push(it);S.sel=it.id;return np;
}
function presetById(id){return PAIRS.find(p=>p.id===id)||SINGLES.find(p=>p.id===id)||S.customPresets.find(p=>p.id===id);}
const presetName=p=>p.name||(TR[lang]['pc_'+p.id]??TR[lang]['p_'+p.id]??p.id);
function addSingle(p,at){
  hist();const it=newItem(p.w,p.h,presetName(p));let np=false;
  if(at){const x=clamp(at.x-p.w/2,S.margin,Math.max(S.margin,PW()-S.margin-p.w)),y=clamp(at.y-p.h/2,S.margin,Math.max(S.margin,PH()-S.margin-p.h));
    if(!page().items.some(o=>overlaps({x,y,w:p.w,h:p.h},o,S.gap))){it.x=r1(x);it.y=r1(y);page().items.push(it);S.sel=it.id;}else np=place(it);}
  else np=place(it);
  renderAll();toast(np?t('t_newpage'):t('t_added'));
}
function pairLayout(items,p,at){
  const g=S.gap,W2=2*p.w+g,m=S.margin;
  if(at&&W2<=PW()-2*m){const x=clamp(at.x-W2/2,m,PW()-m-W2),y=clamp(at.y-p.h/2,m,Math.max(m,PH()-m-p.h));
    if(!items.some(o=>overlaps({x,y,w:W2,h:p.h},o,g)))return{h:true,x,y};}
  let s=findSpot(items,W2,p.h);if(s)return{h:true,x:s.x,y:s.y};
  s=findSpot(items,p.w,2*p.h+g);if(s)return{h:false,x:s.x,y:s.y};
  return null;
}
function addPair(p,at){
  hist();const pid=uid(),nm=presetName(p),g=S.gap;
  const a=newItem(p.w,p.h,`${nm} – ${t('sideF')}`),b=newItem(p.w,p.h,`${nm} – ${t('sideB')}`);
  a.pair=b.pair=pid;a.side='f';b.side='b';
  let L=pairLayout(page().items,p,at),np=false;
  if(!L){S.pages.splice(S.cur+1,0,{items:[]});S.cur++;np=true;L=pairLayout([],p)||{h:false,x:S.margin,y:S.margin};}
  if(L.h){b.x=r1(L.x);b.y=r1(L.y);a.x=r1(L.x+p.w+g);a.y=r1(L.y);} // front on the right, back on the left
  else{a.x=r1(L.x);a.y=r1(L.y);b.x=r1(L.x);b.y=r1(L.y+p.h+g);}
  page().items.push(a,b);S.sel=a.id;renderAll();toast(np?t('t_newpage'):t('t_added'));
}

/* default layouts: ID front+back centred on top, residence (slightly larger) below */
function builtinDefault(){
  const W=210,g=4,mk=(p,side,x,y,pair)=>{const it=newItem(p.w,p.h,`${presetName(p)} – ${t(side==='f'?'sideF':'sideB')}`);it.x=r1(x);it.y=r1(y);it.pair=pair;it.side=side;return it;};
  const idp=PAIRS[0],rp=PAIRS[1],y1=12,y2=y1+idp.h+10;
  const x1=(W-(2*idp.w+g))/2,x2=(W-(2*rp.w+g))/2,p1=uid(),p2=uid();
  return [{items:[mk(idp,'b',x1,y1,p1),mk(idp,'f',x1+idp.w+g,y1,p1),mk(rp,'b',x2,y2,p2),mk(rp,'f',x2+rp.w+g,y2,p2)]}];
}
function loadInitial(){
  const d=LS.get('idp.default',null);
  if(d&&d.pages&&d.paper){setLayout(d);return;}
  S.paper={id:'A4',w:210,h:297,land:false};S.margin=5;S.gap=4;S.pages=builtinDefault();S.cur=0;S.sel=null;
}

/* ================= snapping ================= */
function snapPos(it,nx,ny,scale){
  if(S.snap>0){nx=Math.round(nx/S.snap)*S.snap;ny=Math.round(ny/S.snap)*S.snap;}
  const th=5/scale,m=S.margin,W=PW(),H=PH(),xs=[m,W-m,W/2],ys=[m,H-m,H/2];
  page().items.forEach(o=>{if(o.id===it.id)return;xs.push(o.x,o.x+o.w,o.x+o.w+S.gap,o.x-S.gap);ys.push(o.y,o.y+o.h,o.y+o.h+S.gap,o.y-S.gap);});
  let bx=th,by=th;
  xs.forEach(v=>[[nx,0],[nx+it.w,it.w],[nx+it.w/2,it.w/2]].forEach(([c,off])=>{const d=Math.abs(c-v);if(d<bx){bx=d;nx=v-off;}}));
  ys.forEach(v=>[[ny,0],[ny+it.h,it.h],[ny+it.h/2,it.h/2]].forEach(([c,off])=>{const d=Math.abs(c-v);if(d<by){by=d;ny=v-off;}}));
  return[r1(nx),r1(ny)];
}

/* ================= rendering ================= */
function frameEl(it,interactive){
  const d=document.createElement('div');
  d.className='frame'+(it.img?'':' empty')+((it.h<32||it.w<48)?' sm':'');d.dataset.id=it.id;
  d.style.cssText=`left:${it.x}mm;top:${it.y}mm;width:${it.w}mm;height:${it.h}mm;`;
  if(it.img&&S.imgs[it.img]){
    d.classList.remove('empty');
    if(it.border>0&&it.bstyle==='solid')d.style.boxShadow=`0 0 0 ${it.border}mm #000`;
    if(it.border>0&&it.bstyle==='dashed'){d.style.outline=`${it.border}mm dashed #000`;d.style.outlineOffset=`${it.border/2}mm`;}
    const im=document.createElement('img');im.src=S.imgs[it.img].src;im.draggable=false;im.style.objectFit=it.fit==='stretch'?'fill':it.fit;d.appendChild(im);
  }else if(interactive){
    d.innerHTML=(it.side?`<span class="tag">${esc(sideName(it.side))}</span>`:'')+
      `<div class="ph">${ic('card',24)}<b>${esc(it.label)||esc(t('emptyHint'))}</b><small>${it.w} × ${it.h} mm</small><em>${esc(t('emptyHint'))} · ${esc(t('emptyNote'))}</em></div><button class="add">${esc(t('click'))}</button>`;
  }
  return d;
}
function renderPageInto(el,pg,interactive){el.innerHTML='';pg.items.forEach(it=>{if(!interactive&&!it.img)return;el.appendChild(frameEl(it,interactive));});}
function renderPage(){
  const el=$('#page'),W=PW(),H=PH();el.style.width=W+'mm';el.style.height=H+'mm';
  renderPageInto(el,page(),true);
  const g=document.createElement('div');g.className='mguide';g.style.cssText=`left:${S.margin}mm;top:${S.margin}mm;width:${W-2*S.margin}mm;height:${H-2*S.margin}mm`;el.prepend(g);
  const sel=selItem();
  if(sel){const fe=el.querySelector(`.frame[data-id="${sel.id}"]`);if(fe){fe.classList.add('sel');['nw','n','ne','e','se','s','sw','w'].forEach(h=>{const x=document.createElement('div');x.className='hd';x.dataset.h=h;fe.appendChild(x);});}}
  applyZoom();
}
function applyZoom(){
  const W=PW(),H=PH();
  if(S.fitZoom){const wk=$('#work');S.zoom=clamp(Math.min((wk.clientWidth-56)/(W*MM),(wk.clientHeight-56)/(H*MM)),0.2,3);}
  const z=S.zoom;$('#page').style.transform=`scale(${z})`;
  const pb=$('#pagebox');pb.style.width=W*MM*z+'px';pb.style.height=H*MM*z+'px';
  $('#zv').textContent=Math.round(z*100)+'%';renderFtb();
}
function renderFtb(){
  const f=$('#ftb'),it=selItem();
  if(!it||(drag&&drag.moved)){f.style.display='none';return;}
  const b=(a,i,tt,c='')=>`<button data-fa="${a}" class="${c}" title="${esc(t(tt))}">${ic(i,17)}</button>`;
  f.innerHTML=b('pick','image','pick')+(it.img?b('edit','crop','editImg')+b('rot','rotate','rot'):'')+(partner(it)?b('swapPair','swap','swapPair'):'')+'<i></i>'+b('del','trash','delItem','dng');
  f.style.display='flex';

function renderPagesBar(){
  const b=$('#pages');b.innerHTML='';
  S.pages.forEach((p,i)=>{const x=document.createElement('button');x.className=i===S.cur?'on':'';x.textContent=`${t('page')} ${i+1}`;x.onclick=()=>{S.cur=i;S.sel=null;renderAll();};b.appendChild(x);});

function renderTray(){
  const tr=$('#tray');tr.innerHTML='';let n=0;
  Object.entries(S.imgs).filter(([k,e])=>e.lib).forEach(([k,e])=>{n++;
    const d=document.createElement('div');d.className='th';d.draggable=true;d.title=e.name;

    d.ondblclick=()=>fillNext(k);

    tr.appendChild(d);});
  $('#trayN').textContent=n?`(${n})`:'';
}
function miniBox(w,h){const m=Math.max(w,h),s=40/m;return `<span class="mini"><i style="width:${Math.max(8,w*s)}px;height:${Math.max(8,h*s)}px"></i></span>`;}
function renderPresets(){

function renderAll(){renderPage();renderPagesBar();renderProps();}

/* ================= images ================= */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function makeThumb(im){const c=document.createElement('canvas'),s=Math.min(1,220/Math.max(im.naturalWidth,im.naturalHeight));c.width=Math.max(1,im.naturalWidth*s);c.height=Math.max(1,im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7);}
async function registerImage(src,name,lib=true){
  const im=await loadImg(src);let out=src;const mx=Math.max(im.naturalWidth,im.naturalHeight);
  if(mx>5000){const s=5000/mx,c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',.95);}
  const k=uid();S.imgs[k]={name,src:out,orig:out,th:makeThumb(im),lib,w:im.naturalWidth,h:im.naturalHeight};return k;
}
const fileToDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});
function setupPdfWorker(){const w=$('#pdfworker').textContent;pdfjsLib.GlobalWorkerOptions.workerSrc=w.trim()?URL.createObjectURL(new Blob([w],{type:'text/javascript'})):'lib/pdf.worker.min.js';}
const isPdf=f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name);
async function importFiles(files){
  const keys=[];
  for(const f of files){
    try{
      if(isPdf(f)){
        const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
        for(let p=1;p<=pdf.numPages;p++){
          const pg=await pdf.getPage(p),v0=pg.getViewport({scale:1}),sc=Math.min(4,3600/Math.max(v0.width,v0.height)),vp=pg.getViewport({scale:sc});
          const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
          const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:cx,viewport:vp}).promise;
          keys.push(await registerImage(c.toDataURL('image/jpeg',.93),pdf.numPages>1?`${f.name} p${p}`:f.name));
        }
      }else if(/^image\//.test(f.type)||/\.(jpe?g|png|webp|bmp|gif)$/i.test(f.name)){
        keys.push(await registerImage(await fileToDataURL(f),f.name||'image'));
      }
    }catch(e){console.error(e);toast(t('t_pdferr')+': '+f.name);}
  }
  renderTray();return keys;
}
function setImage(it,key){hist();it.img=key;renderAll();}
function dims(e){const ar=e.w/e.h;let w=ar>=1?100:100*ar,h=ar>=1?100/ar:100;if(ar>1.4&&ar<1.8){w=85.6;h=54;}return[w,h];}
function addImageAsFrame(key,at){
  const[w,h]=dims(S.imgs[key]);hist();const it=newItem(w,h,'',key);
  if(at){it.x=r1(clamp(at.x-w/2,0,Math.max(0,PW()-w)));it.y=r1(clamp(at.y-h/2,0,Math.max(0,PH()-h)));page().items.push(it);S.sel=it.id;renderAll();}
  else{const np=place(it);renderAll();if(np)toast(t('t_newpage'));}
}
function fillNext(key){
  const s=selItem();if(s&&!s.img){setImage(s,key);return;}
  const e=page().items.filter(i=>!i.img).sort((a,b)=>a.y-b.y||a.x-b.x)[0];
  if(e){hist();e.img=key;S.sel=e.id;renderAll();}else addImageAsFrame(key);
}
async function dropKeys(keys,targetId,at){
  if(!keys.length)return;const items=page().items,used=[...keys];
  const empties=()=>items.filter(i=>!i.img).sort((a,b)=>a.y-b.y||a.x-b.x);hist();
  if(targetId){const tg=items.find(i=>i.id===targetId);tg.img=used.shift();S.sel=tg.id;}
  for(const e of empties()){if(!used.length)break;e.img=used.shift();}
  used.forEach(k=>{const[w,h]=dims(S.imgs[k]);place(newItem(w,h,'',k));});
  renderAll();
}

/* ================= frame actions ================= */
let pendingPick=null;
function pickFor(id){pendingPick=id;S.sel=id;renderAll();$('#file').click();}
async function rotateItemImage(it){
  const e=S.imgs[it.img];if(!e)return;const im=await loadImg(e.src);
  const c=document.createElement('canvas');c.width=im.naturalHeight;c.height=im.naturalWidth;const x=c.getContext('2d');
  x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);x.drawImage(im,-im.naturalWidth/2,-im.naturalHeight/2);
  const k=uid();S.imgs[k]={...e,src:c.toDataURL('image/jpeg',.95),lib:false,w:c.width,h:c.height};it.img=k;
}
async function actRotate(it){hist();await rotateItemImage(it);const cx=it.x+it.w/2,cy=it.y+it.h/2;[it.w,it.h]=[it.h,it.w];it.x=r1(cx-it.w/2);it.y=r1(cy-it.h/2);renderAll();}
function actDelete(it){hist();const L=page().items;L.splice(L.indexOf(it),1);if(S.sel===it.id)S.sel=null;renderAll();}
function actDelPair(it){const p=partner(it);hist();const L=page().items;[it,p].forEach(x=>{if(x)L.splice(L.indexOf(x),1);});S.sel=null;renderAll();}
function actSwapPair(it){const p=partner(it);if(!p)return;hist();[it.x,p.x]=[p.x,it.x];[it.y,p.y]=[p.y,it.y];renderAll();}
function actDup(it){hist();const c={...it,id:uid(),pair:null,side:null,x:r1(it.x+5),y:r1(it.y+5)};page().items.push(c);S.sel=c.id;renderAll();}
function actFront(it){hist();const L=page().items;L.splice(L.indexOf(it),1);L.push(it);renderAll();}
function actSwapWH(it){hist();const cx=it.x+it.w/2,cy=it.y+it.h/2;[it.w,it.h]=[it.h,it.w];it.x=r1(cx-it.w/2);it.y=r1(cy-it.h/2);renderAll();}
function runAct(a,it){
  if(a==='pick')return pickFor(it.id);if(a==='edit')return openEditor(it);if(a==='rot')return actRotate(it);
  if(a==='del')return actDelete(it);if(a==='delpair')return actDelPair(it);if(a==='swapPair')return actSwapPair(it);
  if(a==='dup')return actDup(it);if(a==='front')return actFront(it);if(a==='swap')return actSwapWH(it);
  hist();if(a==='noimg')it.img=null;if(a==='ch')it.x=r1((PW()-it.w)/2);if(a==='cv')it.y=r1((PH()-it.h)/2);renderAll();
}
$('#props').addEventListener('click',ev=>{const b=ev.target.closest('button[data-a]'),it=selItem();if(b&&it)runAct(b.dataset.a,it);});
$('#ftb').addEventListener('click',ev=>{const b=ev.target.closest('button[data-fa]'),it=selItem();if(b&&it)runAct(b.dataset.fa,it);});
$('#props').addEventListener('change',ev=>{
  const f=ev.target.dataset.f,it=selItem();if(!f||!it)return;hist();
  if(ev.target.type==='checkbox')it[f]=ev.target.checked;
  else if(ev.target.type==='number'){const v=parseFloat(ev.target.value)||0;
    if(it.lock&&(f==='w'||f==='h')){const ar=it.w/it.h;if(f==='w')it.h=r1(v/ar);else it.w=r1(v*ar);}it[f]=r1(v);}
  else it[f]=ev.target.value;
  renderAll();
});

/* ================= pointer interaction ================= */
const pageScale=()=>$('#page').getBoundingClientRect().width/PW();
function pagePt(ev){const r=$('#page').getBoundingClientRect(),s=r.width/PW();return{x:(ev.clientX-r.left)/s,y:(ev.clientY-r.top)/s};}
function inPage(ev){const r=$('#page').getBoundingClientRect();return ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom;}
let drag=null,lastDown={id:null,t:0};
$('#page').addEventListener('pointerdown',ev=>{
  if(ev.button!==0)return;
  if(ev.target.closest('.add')){pickFor(ev.target.closest('.frame').dataset.id);return;}
  const hd=ev.target.closest('.hd'),fe=ev.target.closest('.frame');
  if(!fe){S.sel=null;renderAll();return;}
  const it=item(fe.dataset.id);if(!it)return;
  const now=Date.now(),dbl=lastDown.id===it.id&&now-lastDown.t<400&&!hd;lastDown={id:it.id,t:now};
  if(S.sel!==it.id){S.sel=it.id;renderAll();}
  if(dbl){lastDown={id:null,t:0};if(it.img)openEditor(it);else pickFor(it.id);return;}
  const p=pagePt(ev);drag={it,mode:hd?hd.dataset.h:'move',px:p.x,py:p.y,x:it.x,y:it.y,w:it.w,h:it.h,moved:false,sc:pageScale()};
  $('#page').setPointerCapture(ev.pointerId);ev.preventDefault();
});
$('#page').addEventListener('pointermove',ev=>{
  if(!drag)return;const p=pagePt(ev),dx=p.x-drag.px,dy=p.y-drag.py,it=drag.it;
  if(!drag.moved){if(Math.abs(dx)+Math.abs(dy)<0.4)return;hist();drag.moved=true;$('#ftb').style.display='none';}
  if(drag.mode==='move'){[it.x,it.y]=snapPos(it,drag.x+dx,drag.y+dy,drag.sc);}
  else{
    const m=drag.mode,ar=drag.w/drag.h,keep=it.lock||ev.shiftKey;let x=drag.x,y=drag.y,w=drag.w,h=drag.h;
    if(m.includes('e'))w=drag.w+dx;if(m.includes('s'))h=drag.h+dy;
    if(m.includes('w')){w=drag.w-dx;x=drag.x+dx;}if(m.includes('n')){h=drag.h-dy;y=drag.y+dy;}
    if(S.snap>0){w=Math.round(w/S.snap)*S.snap;h=Math.round(h/S.snap)*S.snap;}
    if(keep){if(m==='n'||m==='s')w=h*ar;else h=w/ar;}

async function frameToJpeg(it,dpi){
  const e=S.imgs[it.img],im=await loadImg(e.src),ppm=Math.max(3,Math.min(dpi/25.4,Math.max(im.naturalWidth/it.w,im.naturalHeight/it.h)));
  const c=document.createElement('canvas');c.width=Math.round(it.w*ppm);c.height=Math.round(it.h*ppm);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  const iw=im.naturalWidth,ih=im.naturalHeight;
  if(it.fit==='stretch')x.drawImage(im,0,0,c.width,c.height);
  else{const s=(it.fit==='cover'?Math.max:Math.min)(c.width/iw,c.height/ih),dw=iw*s,dh=ih*s;x.drawImage(im,(c.width-dw)/2,(c.height-dh)/2,dw,dh);}
  return c.toDataURL('image/jpeg',.93);
}

  const dirs=[],files=[];
  if(node.kind==='node'){const r=await window.fsApi.list(node.path);
    r.dirs.forEach(d=>dirs.push({name:d.name,node:{kind:'node',path:d.path,name:d.name}}));
    r.files.forEach(f=>files.push({name:f.name,getFile:async()=>new File([await window.fsApi.read(f.path)],f.name,{type:mimeOf(f.name)})}));}
  else if(node.kind==='fs'){for await(const[name,h]of node.handle.entries()){if(name.startsWith('.'))continue;
    if(h.kind==='directory')dirs.push({name,node:{kind:'fs',handle:h,name}});else if(FILE_RE.test(name))files.push({name,getFile:()=>h.getFile()});}}
  else{node.dirs.forEach((n,name)=>dirs.push({name,node:n}));node.files.forEach(f=>{if(FILE_RE.test(f.name))files.push({name:f.name,getFile:async()=>f});});}
  dirs.sort((a,b)=>collator.compare(a.name,b.name));files.sort((a,b)=>collator.compare(a.name,b.name));return{dirs,files};
}
async function fbLoad(){
  $('#fbview').style.display='';renderIntro();
  try{FB.items=await fbList(FB.stack[FB.stack.length-1]);}catch(e){console.warn(e);FB.items={dirs:[],files:[]};toast(t('fbErr'));}
  FB.entries.clear();FB.items.files.forEach(f=>{f.id=uid();FB.entries.set(f.id,f);});renderFB();
}
function renderFB(){
  if(!FB.root)return;
  const cr=$('#crumbs');cr.innerHTML='';
  const skip=Math.max(0,FB.stack.length-4);if(skip){const e=document.createElement('a');e.textContent='…';e.onclick=()=>{FB.stack=FB.stack.slice(0,skip);fbLoad();};cr.appendChild(e);cr.appendChild(document.createTextNode(' › '));}
  FB.stack.forEach((n,i)=>{if(i<skip)return;const last=i===FB.stack.length-1,s=document.createElement(last?'span':'a');s.className=last?'cur':'';s.textContent=n.name;if(!last)s.onclick=()=>{FB.stack=FB.stack.slice(0,i+1);fbLoad();};cr.appendChild(s);if(!last)cr.appendChild(document.createTextNode(' › '));});
  const q=FB.q.toLowerCase(),g=$('#fbgrid');g.innerHTML='';
  const dirs=FB.items.dirs.filter(d=>d.name.toLowerCase().includes(q)),files=FB.items.files.filter(f=>f.name.toLowerCase().includes(q));
  dirs.forEach((d,i)=>{const e=document.createElement('div');e.className='tile dir';e.dataset.dir=i;e.innerHTML=`<div class="im">${ic('folder',34)}</div><div class="nm" title="${esc(d.name)}">${esc(d.name)}</div>`;g.appendChild(e);});
  files.forEach(f=>{const e=document.createElement('div');e.className='tile'+(FB.sel.has(f.id)?' sel':'');e.draggable=true;e.dataset.fid=f.id;
    e.innerHTML=`<div class="im">${ic('image',28)}</div>${/\.pdf$/i.test(f.name)?'<span class="pdfb">PDF</span>':''}<div class="nm" title="${esc(f.name)}">${esc(f.name)}</div>`;g.appendChild(e);io.observe(e);});
  if(!dirs.length&&!files.length)g.innerHTML=`<p class="hint" style="grid-column:1/-1;text-align:center">${esc(t('fbEmpty'))}</p>`;
  FB.shown=dirs;
}
const thumbQ=[];let thumbBusy=0;
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){io.unobserve(en.target);const f=FB.entries.get(en.target.dataset.fid);if(!f)return;if(f.th)setTile(en.target,f.th);else{thumbQ.push([f,en.target]);pumpThumbs();}}}),{root:$('#pbody'),rootMargin:'200px'});
function setTile(el,src){const im=el.querySelector('.im');if(im&&src)im.innerHTML=`<img src="${src}">`;}
function pumpThumbs(){
  while(thumbBusy<3&&thumbQ.length){const[f,el]=thumbQ.shift();thumbBusy++;
    (async()=>{try{f.th=await fileThumb(await f.getFile());setTile(el,f.th);}catch(e){}finally{thumbBusy--;pumpThumbs();}})();}
}
async function fileThumb(file){
  const c=document.createElement('canvas');
  if(isPdf(file)){const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,pg=await pdf.getPage(1),v0=pg.getViewport({scale:1}),vp=pg.getViewport({scale:240/Math.max(v0.width,v0.height)});
    c.width=vp.width;c.height=vp.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:vp}).promise;pdf.destroy();return c.toDataURL('image/jpeg',.7);}
  const url=URL.createObjectURL(file);try{const im=await loadImg(url),s=Math.min(1,240/Math.max(im.naturalWidth,im.naturalHeight));c.width=Math.max(1,im.naturalWidth*s);c.height=Math.max(1,im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.7);}finally{URL.revokeObjectURL(url);}
}
$('#fbgrid').addEventListener('click',ev=>{
  const tl=ev.target.closest('.tile');if(!tl)return;
  if(tl.dataset.dir!==undefined){const d=FB.shown[+tl.dataset.dir];FB.stack.push(d.node);FB.sel.clear();FB.q='';$('#fbq').value='';fbLoad();return;}
  const id=tl.dataset.fid;
  if(ev.ctrlKey||ev.metaKey||ev.shiftKey){FB.sel.has(id)?FB.sel.delete(id):FB.sel.add(id);}else{FB.sel.clear();FB.sel.add(id);}
  $$('#fbgrid .tile[data-fid]').forEach(e=>e.classList.toggle('sel',FB.sel.has(e.dataset.fid)));
});
$('#fbgrid').addEventListener('dblclick',async ev=>{
  const tl=ev.target.closest('.tile[data-fid]');if(!tl)return;const f=FB.entries.get(tl.dataset.fid);
  const keys=await importFiles([await f.getFile()]);const s=selItem();await dropKeys(keys,s&&!s.img?s.id:null);
});
$('#fbgrid').addEventListener('dragstart',ev=>{
  const tl=ev.target.closest('.tile[data-fid]');if(!tl)return;const id=tl.dataset.fid,ids=FB.sel.has(id)?[...FB.sel]:[id];
  ev.dataTransfer.setData('application/x-idfile',JSON.stringify(ids));ev.dataTransfer.effectAllowed='copy';
});
$('#fbq').oninput=e=>{FB.q=e.target.value;renderFB();};
$('#fbsz').oninput=e=>$('#fbgrid').style.setProperty('--ts',e.target.value+'px');
$('#fbUp').onclick=()=>{if(FB.stack.length>1){FB.stack.pop();fbLoad();}};
$('#fbRef').onclick=()=>{FB.items.files.forEach(f=>delete f.th);fbLoad();};

/* ================= image editor ================= */
const ED={it:null,base:null,crop:null,levels:null};
async function openEditor(it){
  const e=S.imgs[it.img];if(!e)return;ED.it=it;ED.entry=e;ED.levels=null;
  const im=await loadImg(e.src);ED.base=document.createElement('canvas');ED.base.width=im.naturalWidth;ED.base.height=im.naturalHeight;ED.base.getContext('2d').drawImage(im,0,0);
  ED.crop={x:0,y:0,w:1,h:1};$('#eb').value=0;$('#ec').value=0;$('#eg').checked=false;$('#bv').textContent=0;$('#cv').textContent=0;
  $('#modal').style.display='flex';edDraw();
}
const edParams=()=>({b:+$('#eb').value,c:+$('#ec').value,g:$('#eg').checked,lv:ED.levels});
function adjust(cv,p){
  if(!p.b&&!p.c&&!p.g&&!p.lv)return;
  const x=cv.getContext('2d'),d=x.getImageData(0,0,cv.width,cv.height),a=d.data,cf=(259*(p.c*2.55+255))/(255*(259-p.c*2.55)),bo=p.b*2.55,lut=new Uint8ClampedArray(256);
  for(let i=0;i<256;i++){let v=i;if(p.lv)v=(v-p.lv[0])*255/Math.max(1,p.lv[1]-p.lv[0]);lut[i]=cf*(v-128)+128+bo;}
  for(let i=0;i<a.length;i+=4){let r=a[i],g=a[i+1],b=a[i+2];if(p.g){r=g=b=0.299*r+0.587*g+0.114*b;}a[i]=lut[r|0];a[i+1]=lut[g|0];a[i+2]=lut[b|0];}
  x.putImageData(d,0,0);
}
function edDraw(){
  const maxW=Math.min(innerWidth*.96-300,720),maxH=innerHeight*.78,B=ED.base,s=Math.min(1,maxW/B.width,maxH/B.height),cv=$('#edcv');
  cv.width=Math.round(B.width*s);cv.height=Math.round(B.height*s);cv.getContext('2d').drawImage(B,0,0,cv.width,cv.height);adjust(cv,edParams());edCropBox();
}
function edCropBox(){const c=ED.crop,W=$('#edcv').width,H=$('#edcv').height,el=$('#crop');el.style.left=c.x*W+'px';el.style.top=c.y*H+'px';el.style.width=c.w*W+'px';el.style.height=c.h*H+'px';}
let cd=null;
$('#crop').addEventListener('pointerdown',ev=>{cd={m:ev.target.dataset.h||'move',x:ev.clientX,y:ev.clientY,c:{...ED.crop}};$('#crop').setPointerCapture(ev.pointerId);ev.preventDefault();});
$('#crop').addEventListener('pointermove',ev=>{
  if(!cd)return;const W=$('#edcv').width,H=$('#edcv').height,dx=(ev.clientX-cd.x)/W,dy=(ev.clientY-cd.y)/H,o=cd.c,m=cd.m,min=0.03;let x=o.x,y=o.y,w=o.w,h=o.h;
  if(m==='move'){x=clamp(o.x+dx,0,1-o.w);y=clamp(o.y+dy,0,1-o.h);}
  else{if(m.includes('e'))w=clamp(o.w+dx,min,1-o.x);if(m.includes('s'))h=clamp(o.h+dy,min,1-o.y);
    if(m.includes('w')){const nx=clamp(o.x+dx,0,o.x+o.w-min);w=o.x+o.w-nx;x=nx;}if(m.includes('n')){const ny=clamp(o.y+dy,0,o.y+o.h-min);h=o.y+o.h-ny;y=ny;}}
  ED.crop={x,y,w,h};edCropBox();
});
$('#crop').addEventListener('pointerup',()=>cd=null);
function edRotate(dir){const B=ED.base,c=document.createElement('canvas');c.width=B.height;c.height=B.width;const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(dir*Math.PI/2);x.drawImage(B,-B.width/2,-B.height/2);ED.base=c;ED.crop={x:0,y:0,w:1,h:1};edDraw();}
$('#eL').onclick=()=>edRotate(-1);$('#eR').onclick=()=>edRotate(1);
['eb','ec','eg'].forEach(i=>$('#'+i).addEventListener('input',()=>{$('#bv').textContent=$('#eb').value;$('#cv').textContent=$('#ec').value;edDraw();}));
$('#eAuto').onclick=()=>{
  const c=ED.base,s=Math.min(1,400/c.width),t2=document.createElement('canvas');t2.width=c.width*s;t2.height=c.height*s;
  const x=t2.getContext('2d');x.drawImage(c,0,0,t2.width,t2.height);const d=x.getImageData(0,0,t2.width,t2.height).data,hs=new Uint32Array(256);
  for(let i=0;i<d.length;i+=4)hs[(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])|0]++;
  const tot=d.length/4;let a=0,lo=0,hi=255;for(let i=0;i<256;i++){a+=hs[i];if(a>tot*.01){lo=i;break;}}a=0;for(let i=255;i>=0;i--){a+=hs[i];if(a>tot*.01){hi=i;break;}}
  if(hi-lo<60)lo=Math.max(0,hi-60);ED.levels=[lo,hi];edDraw();
};
$('#eReset').onclick=async()=>{const im=await loadImg(ED.entry.orig);ED.base=document.createElement('canvas');ED.base.width=im.naturalWidth;ED.base.height=im.naturalHeight;ED.base.getContext('2d').drawImage(im,0,0);
  ED.crop={x:0,y:0,w:1,h:1};ED.levels=null;$('#eb').value=0;$('#ec').value=0;$('#eg').checked=false;$('#bv').textContent=0;$('#cv').textContent=0;edDraw();};
$('#eCancel').onclick=()=>{$('#modal').style.display='none';ED.levels=null;};
$('#eOk').onclick=()=>{
  const B=ED.base,c=ED.crop,o=document.createElement('canvas');o.width=Math.max(1,Math.round(B.width*c.w));o.height=Math.max(1,Math.round(B.height*c.h));
  o.getContext('2d').drawImage(B,Math.round(B.width*c.x),Math.round(B.height*c.y),o.width,o.height,0,0,o.width,o.height);adjust(o,edParams());
  hist();const k=uid();S.imgs[k]={...ED.entry,src:o.toDataURL('image/jpeg',.95),lib:false,w:o.width,h:o.height};ED.it.img=k;
  $('#modal').style.display='none';ED.levels=null;renderAll();
};

/* ================= init ================= */
paintIcons();applyTheme();applyLang();
try{setupPdfWorker();}catch(e){console.warn(e);}
loadInitial();
renderPresets();renderLays();renderTray();renderIntro();showTab('files');syncPageControls();renderAll();
if(DESK){window.fsApi.places().then(p=>{FB.places=p;renderIntro();const d=p.find(x=>x.key==='desktop')||p[0];if(d)fbOpenNode(d.path);});}
idb.get('last').then(h=>{if(h&&h.kind==='directory'){FB.lastHandle=h;renderIntro();}});
</script>
