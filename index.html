<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مقارنة ملفات Excel</title>
<script src="lib/xlsx.full.min.js"></script>
<script>window.XLSX || document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>')</script>
<style>
  :root {
    --bg: #f4f6fa; --card: #fff; --text: #1f2937; --muted: #6b7280; --border: #e5e7eb;
    --primary: #2563eb; --primary-dark: #1d4ed8;
    --ok: #16a34a; --ok-bg: #dcfce7;
    --warn: #d97706; --warn-bg: #fef3c7;
    --bad: #dc2626; --bad-bg: #fee2e2;
    --info: #7c3aed; --info-bg: #ede9fe;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--primary); color: #fff; padding: 18px 24px; }
  header h1 { margin: 0; font-size: 22px; }
  header p { margin: 4px 0 0; opacity: .85; font-size: 14px; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
  .files { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .files { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .card h2 { margin: 0 0 12px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .badge-num { background: var(--primary); color: #fff; border-radius: 50%; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], select { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-family: inherit; background: #fff; }
  input[type=text]:focus, select:focus { outline: 2px solid #bfdbfe; border-color: var(--primary); }
  .file-btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: 2px dashed #93c5fd; background: #eff6ff; color: var(--primary-dark); padding: 14px; border-radius: 10px; cursor: pointer; font-weight: 600; margin-top: 12px; }
  .file-btn:hover { background: #dbeafe; }
  .file-btn input { display: none; }
  .file-info { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
  .file-info b { color: var(--ok); }
  .cols { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .hidden { display: none !important; }
  .options { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
  .options label { display: inline-flex; align-items: center; gap: 6px; margin: 0; color: var(--text); font-size: 14px; cursor: pointer; }
  .actions { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { font-family: inherit; font-size: 15px; border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; font-weight: 600; }
  .btn-primary { background: var(--primary); color: #fff; font-size: 17px; padding: 12px 40px; }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
  .btn-light { background: #fff; border: 1px solid var(--border); color: var(--text); }
  .btn-light:hover { background: #f3f4f6; }
  .btn-sm { padding: 6px 12px; font-size: 13px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 20px 0; }
  .stat { border-radius: 10px; padding: 14px; cursor: pointer; border: 2px solid transparent; }
  .stat.active { border-color: currentColor; }
  .stat .n { font-size: 28px; font-weight: 700; }
  .stat .t { font-size: 13px; margin-top: 4px; }
  .s-ok { background: var(--ok-bg); color: var(--ok); }
  .s-warn { background: var(--warn-bg); color: var(--warn); }
  .s-bad { background: var(--bad-bg); color: var(--bad); }
  .s-info { background: var(--info-bg); color: var(--info); }
  .s-all { background: #e0e7ff; color: #3730a3; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .toolbar input { flex: 1; min-width: 200px; }
  .report { margin-bottom: 24px; }
  .report h3 { margin: 0 0 10px; font-size: 17px; }
  .report .sub { font-size: 13px; color: var(--muted); margin: -6px 0 10px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; background: #fff; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  th { background: #f9fafb; font-weight: 600; position: sticky; top: 0; }
  tr:hover td { background: #f9fafb; }
  td.num { color: var(--muted); width: 40px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .diff { background: #fde68a; border-radius: 3px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  .act { white-space: nowrap; }
  .act button { padding: 3px 8px; font-size: 12px; margin: 1px; border: 1px solid var(--border); background: #fff; border-radius: 6px; font-weight: 600; }
  .act button:hover { background: #f3f4f6; }
  .act .b-ok { color: var(--ok); border-color: #86efac; }
  .act .b-warn { color: var(--warn); border-color: #fcd34d; }
  .act .b-bad { color: var(--bad); border-color: #fca5a5; }
  .act .b-link { color: var(--primary); border-color: #93c5fd; }
  .tag-manual { background: #e0e7ff; color: #3730a3; margin-inline-start: 6px; }
  .s-rec { background: #cffafe; color: #0e7490; }
  .s-conf { background: #f3f4f6; color: #4b5563; }

  .progress { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; }
  .progress .bar { height: 12px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .progress .bar div { height: 100%; background: linear-gradient(90deg, #16a34a, #22c55e); transition: width .3s; }
  .progress .done { color: var(--ok); font-weight: 700; }

  .rec-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .rec-grid { grid-template-columns: 1fr; } }
  .rec-col { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .rec-col h4 { margin: 0; padding: 10px 12px; background: #f9fafb; border-bottom: 1px solid var(--border); font-size: 15px; display: flex; justify-content: space-between; }
  .rec-col input { border-radius: 0; border: none; border-bottom: 1px solid var(--border); }
  .rec-list { max-height: 460px; overflow-y: auto; }
  .rec-item { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .rec-item:hover { background: #f9fafb; }
  .rec-item.sel { background: #dbeafe; outline: 2px solid var(--primary); outline-offset: -2px; }
  .rec-item .rid { color: var(--muted); font-size: 13px; min-width: 70px; }
  .rec-item .rname { flex: 1; }
  .rec-item .rsim { font-size: 12px; }
  .rec-bar { position: sticky; bottom: 0; background: #fff; border: 2px solid var(--primary); border-radius: 10px; padding: 12px; margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; box-shadow: 0 -4px 12px rgba(0,0,0,.06); }
  .rec-bar .pick { flex: 1; min-width: 220px; font-size: 14px; }
  .rec-bar .pick b { color: var(--primary-dark); }
  .btn-ok { background: var(--ok); color: #fff; }
  .pending { flex-basis: 100%; border-top: 1px solid var(--border); padding-top: 10px; }
  .pending-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .pending-list { max-height: 240px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; }
  .pending-list td, .pending-list th { white-space: normal; padding: 6px 8px; }
  .pending-list select { width: auto; padding: 4px 6px; font-size: 13px; }
  .pending-actions { display: flex; gap: 10px; margin-top: 10px; }
  .btn-warn { background: var(--warn); color: #fff; }
  .btn-bad { background: #fff; color: var(--bad); border: 1px solid #fca5a5; }
  .btn-ok:disabled, .btn-warn:disabled, .btn-bad:disabled { opacity: .45; cursor: not-allowed; }

  .print-header { display: none; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }

  @media print {
    body { background: #fff; }
    header, .files, .options, .actions, .summary, .toolbar, .no-print, footer { display: none !important; }
    main { padding: 0; max-width: none; }
    .card { border: none; padding: 0; }
    .report { page-break-after: always; }
    .report:last-child { page-break-after: auto; }
    .report.print-skip, .act { display: none !important; }
    .print-header { display: block; text-align: center; margin-bottom: 12px; }
    .print-header h2 { margin: 0; font-size: 18px; }
    .print-header p { margin: 4px 0 0; font-size: 12px; color: #555; }
    th { position: static; }
    th, td { white-space: normal; font-size: 12px; padding: 5px 6px; border: 1px solid #ccc; }
    .table-wrap { overflow: visible; border: none; }
  }
</style>
</head>
<body>

<header>
  <h1>📊 مقارنة ملفات Excel حسب الرقم الوظيفي</h1>
  <p>استورد ملفين، سمِّ كل ملف، ثم اضغط «قارن» لعرض المتطابق والمختلف والناقص في كل ملف مع إمكانية الطباعة والتصدير</p>
</header>

<main>
  <section class="files">
    <!-- File A -->
    <div class="card" id="cardA">
      <h2><span class="badge-num">1</span> الملف الأول</h2>
      <label for="nameA">اسم الملف (مثال: الحسابات، الإدارة)</label>
      <input type="text" id="nameA" placeholder="اكتب اسم الملف الأول" value="الحسابات">
      <label class="file-btn">📥 استيراد ملف Excel
        <input type="file" id="fileA" accept=".xlsx,.xls,.xlsm,.csv">
      </label>
      <div class="file-info" id="infoA">لم يتم اختيار ملف</div>
      <div class="cols hidden" id="colsA">
        <div><label>الورقة (Sheet)</label><select id="sheetA"></select></div>
        <div><label>عمود الرقم الوظيفي (ID)</label><select id="idColA"></select></div>
        <div><label>عمود الاسم (Name)</label><select id="nameColA"></select></div>
      </div>
    </div>

    <!-- File B -->
    <div class="card" id="cardB">
      <h2><span class="badge-num">2</span> الملف الثاني</h2>
      <label for="nameB">اسم الملف (مثال: البصمة)</label>
      <input type="text" id="nameB" placeholder="اكتب اسم الملف الثاني" value="البصمة">
      <label class="file-btn">📥 استيراد ملف Excel
        <input type="file" id="fileB" accept=".xlsx,.xls,.xlsm,.csv">
      </label>
      <div class="file-info" id="infoB">لم يتم اختيار ملف</div>
      <div class="cols hidden" id="colsB">
        <div><label>الورقة (Sheet)</label><select id="sheetB"></select></div>
        <div><label>عمود الرقم الوظيفي (ID)</label><select id="idColB"></select></div>
        <div><label>عمود الاسم (Name)</label><select id="nameColB"></select></div>
      </div>
    </div>
  </section>

  <div class="card options">
    <strong>خيارات المقارنة:</strong>
    <label><input type="checkbox" id="optArabic" checked> توحيد الحروف العربية (أ إ آ ← ا ، ة ← ه ، ى ← ي)</label>
    <label><input type="checkbox" id="optSpaces" checked> تجاهل المسافات الزائدة</label>
    <label><input type="checkbox" id="optCase" checked> تجاهل حالة الأحرف الإنجليزية</label>
    <label><input type="checkbox" id="optZeros"> تجاهل الأصفار في بداية الرقم الوظيفي</label>
    <label><input type="checkbox" id="optNoIdName" checked> مطابقة الصفوف بدون رقم وظيفي (فارغ / NULL) بالاسم</label>
  </div>

  <div class="actions">
    <button class="btn-primary" id="compareBtn" disabled>🔍 قارن</button>
    <button class="btn-light" id="saveJsonBtn" title="حفظ البيانات والنتائج كملف JSON">💾 حفظ JSON</button>
    <label class="btn-light" style="display:inline-flex;align-items:center;padding:10px 18px;border-radius:8px;cursor:pointer;font-weight:600;margin:0;color:var(--text);font-size:15px">📂 فتح JSON
      <input type="file" id="loadJson" accept=".json" style="display:none">
    </label>
  </div>

  <section id="results" class="hidden">
    <div class="summary" id="summary"></div>
    <div class="progress" id="progress"></div>

    <div class="card">
      <div class="toolbar">
        <input type="text" id="search" placeholder="🔎 بحث بالرقم الوظيفي أو الاسم...">
        <button class="btn-light btn-sm" id="printCurrent">🖨️ طباعة التقرير المعروض</button>
        <button class="btn-light btn-sm" id="printAll">🖨️ طباعة كل التقارير</button>
        <button class="btn-light btn-sm" id="exportCurrent">📤 تصدير المعروض Excel</button>
        <button class="btn-light btn-sm" id="exportAll">📤 تصدير الكل Excel</button>
      </div>
      <div id="reports"></div>
    </div>
  </section>
</main>

<footer>يعمل بالكامل داخل المتصفح — لا يتم رفع أي بيانات إلى الإنترنت</footer>

<script>
(function () {
  'use strict';

  // ---------- State ----------
  const files = {
    A: { workbook: null, fileName: '', rows: [], headerRow: 0 },
    B: { workbook: null, fileName: '', rows: [], headerRow: 0 }
  };
  let result = null;
  let currentView = 'all';

  const ID_KEYS = ['الرقم الوظيفي', 'رقم وظيفي', 'الرقم الوظيفى', 'رقم الموظف', 'الرقم', 'رقم', 'employee id', 'emp id', 'empid', 'emp no', 'employee no', 'staff id', 'id', 'no', 'code', 'كود', 'الكود'];
  const NAME_KEYS = ['اسم الموظف', 'الاسم', 'اسم', 'employee name', 'full name', 'name'];

  const $ = id => document.getElementById(id);
  const EMPTY_IDS = new Set(['null', 'nil', 'none', 'nan', 'n/a', 'na', '#n/a', 'undefined', 'لايوجد', 'لا يوجد', 'بدون', 'بدونرقم', 'فارغ']);

  // ---------- Helpers ----------
  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function normId(v) {
    let s = String(v ?? '').trim().replace(/\s+/g, '');
    // Arabic-Indic digits → Latin
    s = s.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
    if (/^\d+\.0+$/.test(s)) s = s.replace(/\.0+$/, '');
    if ($('optZeros').checked) s = s.replace(/^0+(?=.)/, '');
    // Placeholder values such as NULL / N/A / - / 0 mean "no employee ID"
    if (EMPTY_IDS.has(s.toLowerCase()) || /^[-_.\/]+$/.test(s) || /^0+$/.test(s)) return '';
    return s;
  }

  function normName(v) {
    let s = String(v ?? '');
    if ($('optSpaces').checked) s = s.replace(/\s+/g, ' ').trim();
    if ($('optArabic').checked) {
      s = s.replace(/[ً-ْـ]/g, '') // tashkeel + tatweel
           .replace(/[أإآٱ]/g, 'ا')
           .replace(/ة/g, 'ه')
           .replace(/ى/g, 'ي')
           .replace(/ؤ/g, 'و')
           .replace(/ئ/g, 'ي');
    }
    if ($('optCase').checked) s = s.toLowerCase();
    return s;
  }

  function similarity(a, b) {
    if (a === b) return 100;
    if (!a.length || !b.length) return 0;
    const m = a.length, n = b.length;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return Math.round((1 - prev[n] / Math.max(m, n)) * 100);
  }

  // Highlight words of `name` that are absent from `other`
  function highlightDiff(name, other) {
    const otherWords = new Set(normName(other).split(/\s+/));
    return String(name ?? '').split(/(\s+)/).map(w => {
      if (/^\s+$/.test(w) || !w) return w;
      return otherWords.has(normName(w)) ? esc(w) : '<span class="diff">' + esc(w) + '</span>';
    }).join('');
  }

  function detectHeaderRow(rows) {
    const limit = Math.min(rows.length, 15);
    let best = 0, bestScore = -1;
    for (let r = 0; r < limit; r++) {
      const cells = (rows[r] || []).map(c => String(c ?? '').trim().toLowerCase());
      let score = 0;
      cells.forEach(c => {
        if (ID_KEYS.some(k => c === k || c.includes(k))) score += 2;
        if (NAME_KEYS.some(k => c === k || c.includes(k))) score += 2;
        if (c && isNaN(c)) score += 0.1;
      });
      if (score > bestScore) { bestScore = score; best = r; }
    }
    return best;
  }

  function guessCol(headers, keys, exclude) {
    const lower = headers.map(h => String(h ?? '').trim().toLowerCase());
    for (const k of keys) {
      const i = lower.findIndex((h, idx) => idx !== exclude && h === k);
      if (i >= 0) return i;
    }
    for (const k of keys) {
      const i = lower.findIndex((h, idx) => idx !== exclude && h.includes(k));
      if (i >= 0) return i;
    }
    return -1;
  }

  function colLetter(i) {
    let s = '';
    i++;
    while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
    return s;
  }

  // ---------- File loading ----------
  function loadSheet(key) {
    const f = files[key];
    const sheetName = $('sheet' + key).value;
    const ws = f.workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
    f.rows = rows;
    f.headerRow = detectHeaderRow(rows);
    const headers = rows[f.headerRow] || [];
    const width = rows.reduce((m, r) => Math.max(m, r.length), 0);

    const idSel = $('idCol' + key), nameSel = $('nameCol' + key);
    idSel.innerHTML = ''; nameSel.innerHTML = '';
    for (let i = 0; i < width; i++) {
      const label = colLetter(i) + ' — ' + (String(headers[i] ?? '').trim() || '(بدون عنوان)');
      idSel.add(new Option(label, i));
      nameSel.add(new Option(label, i));
    }
    let idIdx = guessCol(headers, ID_KEYS, -1);
    let nameIdx = guessCol(headers, NAME_KEYS, idIdx);
    if (idIdx < 0) idIdx = 0;
    if (nameIdx < 0) nameIdx = Math.min(1, width - 1);
    idSel.value = idIdx; nameSel.value = nameIdx;

    const dataCount = Math.max(0, rows.length - f.headerRow - 1);
    $('info' + key).innerHTML = '✅ <b>' + esc(f.fileName) + '</b> — ' + dataCount + ' صف (صف العناوين: ' + (f.headerRow + 1) + ')';
    updateCompareBtn();
  }

  function handleFile(key, file) {
    if (!file) return;
    if (typeof XLSX === 'undefined') {
      alert('تعذر تحميل مكتبة قراءة Excel. تأكد من الاتصال بالإنترنت عند فتح الصفحة لأول مرة.');
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const isCsv = /\.csv$/i.test(file.name);
        const wb = isCsv
          ? XLSX.read(new TextDecoder('utf-8').decode(e.target.result).replace(/^﻿/, ''), { type: 'string', raw: true })
          : XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        files[key].workbook = wb;
        files[key].fileName = file.name;
        const sel = $('sheet' + key);
        sel.innerHTML = '';
        wb.SheetNames.forEach(n => sel.add(new Option(n, n)));
        $('cols' + key).classList.remove('hidden');
        loadSheet(key);
      } catch (err) {
        alert('تعذرت قراءة الملف: ' + err.message);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function updateCompareBtn() {
    $('compareBtn').disabled = !(files.A.rows.length && files.B.rows.length);
  }

  function extract(key) {
    const f = files[key];
    const idIdx = +$('idCol' + key).value, nameIdx = +$('nameCol' + key).value;
    const list = [];
    for (let r = f.headerRow + 1; r < f.rows.length; r++) {
      const row = f.rows[r] || [];
      let rawId = String(row[idIdx] ?? '').trim();
      const name = String(row[nameIdx] ?? '').trim();
      const id = normId(rawId);
      if (!id) rawId = '';
      if (!id && !name) continue;
      list.push({ id, rawId, name, row: r + 1 });
    }
    return list;
  }

  // ---------- Compare ----------
  let uidSeq = 0;
  const sel = { A: null, B: null };        // selected uids in the manual-matching view
  let pending = [];                          // pairs queued for approval: { a: uid, b: uid, type: 'exact' | 'partial' }
  const recSearch = { A: '', B: '' };

  function compare() {
    const labelA = $('nameA').value.trim() || 'الملف الأول';
    const labelB = $('nameB').value.trim() || 'الملف الثاني';
    const listA = extract('A'), listB = extract('B');

    const group = list => {
      const map = new Map(), noId = [];
      list.forEach(it => {
        if (!it.id) { noId.push(it); return; }
        if (!map.has(it.id)) map.set(it.id, []);
        map.get(it.id).push(it);
      });
      return { map, noId };
    };
    const gA = group(listA), gB = group(listB);

    const matched = [], nameDiff = [], onlyA = [], onlyB = [], dups = [];

    // Report real duplicate IDs (same ID on more than one row of the same file)
    gA.map.forEach(items => { if (items.length > 1) items.forEach(it => dups.push({ file: labelA, ...it, count: items.length })); });
    gB.map.forEach(items => { if (items.length > 1) items.forEach(it => dups.push({ file: labelB, ...it, count: items.length })); });

    // 1) Match by employee ID. When an ID repeats, pair each row with the closest name on the other side;
    //    rows left over stay in the remaining lists instead of being dropped.
    const pairUp = (itemsA, itemsB, id) => {
      // Try every A×B combination and take the most similar pairs first
      const cands = [];
      itemsA.forEach(a => itemsB.forEach(b => cands.push({ a, b, sim: similarity(normName(a.name), normName(b.name)) })));
      cands.sort((x, y) => y.sim - x.sim);
      const usedA = new Set(), usedB = new Set();
      cands.forEach(({ a, b, sim }) => {
        if (usedA.has(a) || usedB.has(b)) return;
        usedA.add(a); usedB.add(b);
        if (normName(a.name) === normName(b.name)) matched.push({ id, a, b });
        else nameDiff.push({ id, a, b, sim });
      });
      itemsA.forEach(a => { if (!usedA.has(a)) onlyA.push(a); });
      itemsB.forEach(b => { if (!usedB.has(b)) onlyB.push(b); });
    };
    gA.map.forEach((itemsA, id) => {
      const itemsB = gB.map.get(id);
      if (itemsB) pairUp(itemsA, itemsB, id);
      else itemsA.forEach(a => onlyA.push(a));
    });
    gB.map.forEach((itemsB, id) => { if (!gA.map.has(id)) itemsB.forEach(b => onlyB.push(b)); });

    // 2) Rows without an employee ID (empty, NULL, ...): match by identical name when the name is unique on both sides
    let byName = 0;
    if ($('optNoIdName').checked && (gA.noId.length || gB.noId.length)) {
      const index = list => {
        const m = new Map();
        list.forEach(x => { const k = normName(x.name); if (k) { if (!m.has(k)) m.set(k, []); m.get(k).push(x); } });
        return m;
      };
      const poolA = onlyA.concat(gA.noId), poolB = onlyB.concat(gB.noId);
      const mA = index(poolA), mB = index(poolB);
      const used = new Set();
      mA.forEach((xs, k) => {
        const ys = mB.get(k);
        if (!ys || xs.length !== 1 || ys.length !== 1) return;
        const a = xs[0], b = ys[0];
        if (a.id && b.id) return;              // both have (different) IDs → leave for manual review
        matched.push({ id: a.id || b.id, a, b, manual: 'name' });
        used.add(a); used.add(b); byName++;
      });
      onlyA.length = 0; poolA.forEach(x => { if (!used.has(x)) onlyA.push(x); });
      onlyB.length = 0; poolB.forEach(x => { if (!used.has(x)) onlyB.push(x); });
    } else {
      gA.noId.forEach(x => onlyA.push(x));
      gB.noId.forEach(x => onlyB.push(x));
    }

    result = {
      labelA, labelB, date: new Date().toLocaleString('ar'),
      fileA: files.A.fileName, fileB: files.B.fileName,
      totalA: listA.length, totalB: listB.length,
      noIdA: gA.noId.length, noIdB: gB.noId.length, byName,
      matched, nameDiff, onlyA, onlyB, dups, confirmed: []
    };
    sel.A = sel.B = null;
    pending = [];
    currentView = 'all';
    tidy();
    render();
    $('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Give every movable record a unique id and keep lists sorted
  function tidy() {
    const r = result;
    r.confirmed = r.confirmed || [];
    const lists = [r.matched, r.nameDiff, r.onlyA, r.onlyB, r.confirmed];
    lists.forEach(l => l.forEach(x => { if (x.uid) uidSeq = Math.max(uidSeq, x.uid); }));
    lists.forEach(l => l.forEach(x => { if (!x.uid) x.uid = ++uidSeq; }));
    const byId = (x, y) => String(x.id).localeCompare(String(y.id), undefined, { numeric: true });
    [r.matched, r.onlyA, r.onlyB, r.confirmed].forEach(l => l.sort(byId));
    r.nameDiff.sort((x, y) => x.sim - y.sim || byId(x, y));
    if (sel.A && !r.onlyA.some(x => x.uid === sel.A)) sel.A = null;
    if (sel.B && !r.onlyB.some(x => x.uid === sel.B)) sel.B = null;
    pending = pending.filter(p => r.onlyA.some(x => x.uid === p.a) && r.onlyB.some(x => x.uid === p.b));
  }

  function take(list, uid) {
    const i = list.findIndex(x => x.uid === uid);
    return i < 0 ? null : list.splice(i, 1)[0];
  }

  const NO_ID = 'بدون رقم';
  const idText = x => x.rawId || NO_ID;
  const pairId = p => p.a.id === p.b.id ? idText(p.a) : idText(p.a) + ' ↔ ' + idText(p.b);
  const methodText = p => p.manual === 'link' ? 'ربط يدوي' : p.manual === 'verified' ? 'نُقل بعد التحقق' : p.manual === 'name' ? 'مطابقة بالاسم (بدون رقم)' : 'تلقائي';
  const methodTag = p => p.manual ? '<span class="tag tag-manual">' + methodText(p) + '</span>' : '';

  // ---------- Moving records between reports ----------
  function doAction(act, uid) {
    const r = result, A = r.labelA, B = r.labelB;
    const find = list => list.find(x => x.uid === uid);
    let p, it;
    switch (act) {
      case 'toExact':
        p = find(r.nameDiff);
        if (!p || !confirm('نقل إلى «متطابق تماماً» بعد التأكد؟\n\n' + A + ': ' + p.a.name + ' (' + idText(p.a) + ')\n' + B + ': ' + p.b.name + ' (' + idText(p.b) + ')')) return;
        take(r.nameDiff, uid); p.manual = p.manual || 'verified'; r.matched.push(p);
        break;
      case 'toPartial':
        p = find(r.matched);
        if (!p || !confirm('نقل إلى «اختلاف في الاسم / مطابقة جزئية»؟\n\n' + A + ': ' + p.a.name + '\n' + B + ': ' + p.b.name)) return;
        take(r.matched, uid);
        if (p.sim == null) p.sim = similarity(normName(p.a.name), normName(p.b.name));
        p.manual = p.manual || 'verified'; r.nameDiff.push(p);
        break;
      case 'unlink':
        p = find(r.matched) || find(r.nameDiff);
        if (!p || !confirm('فك الربط وإرجاع الاسمين إلى قائمة الباقي؟\n\n' + A + ': ' + p.a.name + '\n' + B + ': ' + p.b.name)) return;
        take(r.matched, uid) || take(r.nameDiff, uid);
        r.onlyA.push(p.a); r.onlyB.push(p.b);
        break;
      case 'matchA': case 'matchB':
        sel[act.slice(-1)] = uid; currentView = 'reconcile';
        break;
      case 'missA': case 'missB': {
        const side = act.slice(-1), list = side === 'A' ? r.onlyA : r.onlyB;
        it = find(list);
        const other = side === 'A' ? B : A;
        if (!it || !confirm('تأكيد أن «' + it.name + '» (' + idText(it) + ') غير موجود فعلاً في ' + other + '؟')) return;
        take(list, uid); it.side = side; r.confirmed.push(it);
        break;
      }
      case 'restore':
        it = take(r.confirmed, uid);
        if (!it) return;
        (it.side === 'A' ? r.onlyA : r.onlyB).push(it); delete it.side;
        break;
      default: return;
    }
    tidy();
    render();
  }

  // Queue the current A/B selection as a pair waiting for approval
  function queueSelection() {
    const r = result;
    const a = r.onlyA.find(x => x.uid === sel.A), b = r.onlyB.find(x => x.uid === sel.B);
    if (!a || !b) return;
    const sim = similarity(normName(a.name), normName(b.name));
    pending.push({ a: a.uid, b: b.uid, type: sim === 100 ? 'exact' : 'partial' });
    sel.A = sel.B = null;
  }

  function approvePending() {
    const r = result;
    const rows = pending.map(p => ({ p, a: r.onlyA.find(x => x.uid === p.a), b: r.onlyB.find(x => x.uid === p.b) })).filter(x => x.a && x.b);
    if (!rows.length) return;
    const nEx = rows.filter(x => x.p.type === 'exact').length;
    const preview = rows.slice(0, 15).map((x, i) => (i + 1) + ') ' + x.a.name + '  ⇄  ' + x.b.name + '  [' + (x.p.type === 'exact' ? 'تام' : 'جزئي') + ']').join('\n') +
      (rows.length > 15 ? '\n… و ' + (rows.length - 15) + ' أخرى' : '');
    if (!confirm('الموافقة على ربط ' + rows.length + ' زوج؟\n(متطابق تام: ' + nEx + ' — جزئي: ' + (rows.length - nEx) + ')\n\n' + preview)) return;
    rows.forEach(({ p, a, b }) => {
      take(r.onlyA, a.uid); take(r.onlyB, b.uid);
      const pair = { id: a.id, a, b, manual: 'link', sim: similarity(normName(a.name), normName(b.name)) };
      (p.type === 'exact' ? r.matched : r.nameDiff).push(pair);
    });
    pending = [];
    sel.A = sel.B = null;
    tidy();
    render();
  }

  function markSelectedMissing() {
    const r = result;
    const a = r.onlyA.find(x => x.uid === sel.A), b = r.onlyB.find(x => x.uid === sel.B);
    const picked = [a && [a, 'A', r.labelB], b && [b, 'B', r.labelA]].filter(Boolean);
    if (!picked.length) return;
    const msg = picked.map(([x, , other]) => '• ' + x.name + ' (' + idText(x) + ') غير موجود في ' + other).join('\n');
    if (!confirm('تأكيد عدم الوجود:\n\n' + msg)) return;
    picked.forEach(([x, side]) => { take(side === 'A' ? r.onlyA : r.onlyB, x.uid); x.side = side; r.confirmed.push(x); });
    sel.A = sel.B = null;
    tidy();
    render();
  }

  // ---------- Report definitions ----------
  function btn(act, uid, cls, text) {
    return '<button class="' + cls + '" data-act="' + act + '" data-uid="' + uid + '">' + text + '</button>';
  }

  function reportDefs() {
    const r = result, A = r.labelA, B = r.labelB;
    return [
      {
        key: 'matched', cls: 's-ok', title: 'متطابق تماماً', desc: 'نفس الرقم الوظيفي ونفس الاسم في الملفين، أو تم ربطه/نقله يدوياً بعد التأكد',
        items: r.matched,
        cols: ['الرقم الوظيفي', 'الاسم في ' + A, 'الاسم في ' + B, 'طريقة المطابقة'],
        cells: x => [esc(pairId(x)), esc(x.a.name), esc(x.b.name), methodText(x)],
        plain: x => [pairId(x), x.a.name, x.b.name, methodText(x)],
        actions: x => btn('toPartial', x.uid, 'b-warn', '⇠ جزئي') + btn('unlink', x.uid, 'b-bad', '✂ فك الربط')
      },
      {
        key: 'nameDiff', cls: 's-warn', title: 'اختلاف في الاسم (مطابقة جزئية)', desc: 'الرقم الوظيفي موجود في الملفين لكن الاسم مختلف (الكلمات المختلفة مظللة). بعد التأكد انقله إلى «متطابق تماماً»',
        items: r.nameDiff,
        cols: ['الرقم الوظيفي', 'الاسم في ' + A, 'الاسم في ' + B, 'نسبة التشابه'],
        cells: x => [esc(pairId(x)) + methodTag(x), highlightDiff(x.a.name, x.b.name), highlightDiff(x.b.name, x.a.name),
          '<span class="tag ' + (x.sim >= 80 ? 's-warn' : 's-bad') + '">' + x.sim + '%</span>'],
        plain: x => [pairId(x), x.a.name, x.b.name, x.sim + '%'],
        actions: x => btn('toExact', x.uid, 'b-ok', '✔ نقل إلى تام') + btn('unlink', x.uid, 'b-bad', '✂ فك الربط')
      },
      {
        key: 'onlyA', cls: 's-bad', title: 'موجود في ' + A + ' فقط', desc: 'غير موجود في ' + B + ' — استخدم «مطابقة يدوية» لربطه باسم من ' + B,
        items: r.onlyA,
        cols: ['الرقم الوظيفي', 'الاسم', 'رقم الصف'],
        cells: x => [esc(idText(x)), esc(x.name), x.row],
        plain: x => [idText(x), x.name, x.row],
        actions: x => btn('matchA', x.uid, 'b-link', '🔗 مطابقة يدوية') + btn('missA', x.uid, 'b-bad', '✖ غير موجود فعلاً')
      },
      {
        key: 'onlyB', cls: 's-bad', title: 'موجود في ' + B + ' فقط', desc: 'غير موجود في ' + A + ' — استخدم «مطابقة يدوية» لربطه باسم من ' + A,
        items: r.onlyB,
        cols: ['الرقم الوظيفي', 'الاسم', 'رقم الصف'],
        cells: x => [esc(idText(x)), esc(x.name), x.row],
        plain: x => [idText(x), x.name, x.row],
        actions: x => btn('matchB', x.uid, 'b-link', '🔗 مطابقة يدوية') + btn('missB', x.uid, 'b-bad', '✖ غير موجود فعلاً')
      },
      {
        key: 'confirmed', cls: 's-conf', title: 'مؤكد غير موجود', desc: 'أسماء تم التأكد أنها غير موجودة في الملف الآخر',
        items: r.confirmed,
        cols: ['موجود في', 'غير موجود في', 'الرقم الوظيفي', 'الاسم', 'رقم الصف'],
        cells: x => [esc(x.side === 'A' ? A : B), esc(x.side === 'A' ? B : A), esc(idText(x)), esc(x.name), x.row],
        plain: x => [x.side === 'A' ? A : B, x.side === 'A' ? B : A, idText(x), x.name, x.row],
        actions: x => btn('restore', x.uid, 'b-link', '↩ إرجاع للباقي')
      },
      {
        key: 'dups', cls: 's-info', title: 'أرقام مكررة', desc: 'نفس الرقم الوظيفي مكرر في أكثر من صف داخل نفس الملف (للعلم فقط — كل الصفوف تدخل المقارنة، ويُربط كل صف بأقرب اسم في الملف الآخر)',
        items: r.dups,
        cols: ['الملف', 'الرقم الوظيفي', 'الاسم', 'رقم الصف', 'الملاحظة'],
        cells: x => [esc(x.file), esc(x.rawId), esc(x.name), x.row, 'مكرر ' + x.count + ' مرات'],
        plain: x => [x.file, x.rawId, x.name, x.row, 'مكرر ' + x.count + ' مرات']
      }
    ];
  }

  // ---------- Render ----------
  function tile(view, cls, n, text) {
    return '<div class="stat ' + cls + (currentView === view ? ' active' : '') + '" data-view="' + view + '">' +
      '<div class="n">' + n + '</div><div class="t">' + text + '</div></div>';
  }

  function render() {
    const r = result;
    $('results').classList.remove('hidden');
    const defs = reportDefs();
    const get = k => defs.find(d => d.key === k);
    const totalDiff = r.nameDiff.length + r.onlyA.length + r.onlyB.length;
    const remaining = r.onlyA.length + r.onlyB.length;

    let html = tile('all', 's-all', totalDiff, 'إجمالي الفروقات<br>' + esc(r.labelA) + ': ' + r.totalA + ' | ' + esc(r.labelB) + ': ' + r.totalB);
    ['matched', 'nameDiff', 'onlyA', 'onlyB'].forEach(k => { const d = get(k); html += tile(k, d.cls, d.items.length, esc(d.title)); });
    html += tile('reconcile', 's-rec', remaining, '🔗 المطابقة اليدوية<br>(الباقي من الملفين)');
    ['confirmed', 'dups'].forEach(k => { const d = get(k); html += tile(k, d.cls, d.items.length, esc(d.title)); });
    $('summary').innerHTML = html;
    $('summary').querySelectorAll('.stat').forEach(el => el.onclick = () => { currentView = el.dataset.view; render(); });

    // Progress towards a complete reconciliation
    const handled = (r.matched.length + r.nameDiff.length) * 2 + r.confirmed.length;
    const pct = handled + remaining ? Math.round(handled / (handled + remaining) * 100) : 100;
    const noIdNote = (r.noIdA || r.noIdB)
      ? '<div style="font-size:13px;color:var(--muted);margin-top:6px">صفوف بدون رقم وظيفي (فارغ / NULL): ' +
        (r.noIdA ? esc(r.labelA) + ' <b>' + r.noIdA + '</b> ' : '') + (r.noIdB ? esc(r.labelB) + ' <b>' + r.noIdB + '</b> ' : '') +
        '— طوبق منها بالاسم تلقائياً: <b>' + (r.byName || 0) + '</b>، والباقي في قائمة المطابقة اليدوية</div>'
      : '';
    $('progress').innerHTML = (remaining
      ? 'نسبة الإنجاز: <b>' + pct + '%</b> — الباقي بدون مطابقة: ' + esc(r.labelA) + ' <b>' + r.onlyA.length + '</b> ، ' + esc(r.labelB) + ' <b>' + r.onlyB.length + '</b>' +
        (r.nameDiff.length ? ' — مطابقة جزئية بانتظار التحقق: <b>' + r.nameDiff.length + '</b>' : '') +
        '<div class="bar"><div style="width:' + pct + '%"></div></div>'
      : '<span class="done">✅ اكتملت المقارنة — لا يوجد أي اسم باقٍ بدون مطابقة</span>' +
        (r.nameDiff.length ? ' (مطابقة جزئية بانتظار التحقق: <b>' + r.nameDiff.length + '</b>)' : '') +
        '<div class="bar"><div style="width:100%"></div></div>') + noIdNote;

    renderReports();
  }

  function renderReports() {
    const rec = currentView === 'reconcile';
    $('search').style.display = rec ? 'none' : '';
    if (rec) { renderReconcile(); return; }

    const q = $('search').value.trim();
    const qn = normName(q), qi = normId(q);
    const filter = (d, x) => {
      if (!q) return true;
      const p = d.plain(x).map(String);
      return p.some(v => normName(v).includes(qn) || normId(v).includes(qi));
    };

    const defs = reportDefs().filter(d => currentView === 'all' || d.key === currentView);
    $('reports').innerHTML = defs.map(d => {
      const items = d.items.filter(x => filter(d, x));
      const actTh = d.actions ? '<th class="act">إجراء</th>' : '';
      const body = items.length
        ? '<div class="table-wrap"><table><thead><tr><th>#</th>' + d.cols.map(c => '<th>' + esc(c) + '</th>').join('') + actTh + '</tr></thead><tbody>' +
          items.map((x, i) => '<tr><td class="num">' + (i + 1) + '</td>' + d.cells(x).map(c => '<td>' + c + '</td>').join('') +
            (d.actions ? '<td class="act">' + d.actions(x) + '</td>' : '') + '</tr>').join('') +
          '</tbody></table></div>'
        : '<div class="empty">لا توجد سجلات</div>';
      return '<div class="report" data-key="' + d.key + '">' +
        '<div class="print-header"><h2>' + esc(d.title) + ' (' + items.length + ')</h2><p>مقارنة: ' + esc(result.labelA) + ' مع ' + esc(result.labelB) + ' — ' + esc(result.date) + '</p></div>' +
        '<h3 class="no-print"><span class="tag ' + d.cls + '">' + items.length + '</span> ' + esc(d.title) +
        ' <button class="btn-light btn-sm" data-print="' + d.key + '">🖨️ طباعة</button>' +
        ' <button class="btn-light btn-sm" data-export="' + d.key + '">📤 Excel</button></h3>' +
        '<p class="sub no-print">' + esc(d.desc) + '</p>' + body + '</div>';
    }).join('');
  }

  // ---------- Manual matching view (remaining names side by side) ----------
  function renderReconcile() {
    const r = result;
    const col = k => '<div class="rec-col"><h4><span>الباقي من ' + esc(k === 'A' ? r.labelA : r.labelB) + '</span><span class="tag s-bad" id="recCnt' + k + '"></span></h4>' +
      '<input type="text" id="recSearch' + k + '" placeholder="🔎 بحث بالرقم أو الاسم..." value="' + esc(recSearch[k]) + '">' +
      '<div class="rec-list" id="recList' + k + '"></div></div>';
    $('reports').innerHTML = '<div class="report no-print">' +
      '<h3>🔗 المطابقة اليدوية — الباقي بعد المتطابق التام والجزئي</h3>' +
      '<p class="sub">اختر اسماً من ' + esc(r.labelA) + ' واسماً من ' + esc(r.labelB) + ' ثم اربطهما كمطابق تام أو جزئي بعد التأكد. ' +
      'عند اختيار اسم من جهة تُرتَّب القائمة الأخرى حسب نسبة التشابه (الأقرب أولاً). اختيار الاسم ثم المشابه له = زوج واحد يُضاف إلى «قائمة الربط»؛ ' +
      'كرر لأكثر من اسم ثم اضغط «موافقة وربط الكل». وإذا تأكدت أن الاسم غير موجود في الملف الآخر اضغط «غير موجود فعلاً».</p>' +
      '<div class="rec-grid">' + col('A') + col('B') + '</div>' +
      '<div class="rec-bar" id="recBar"></div></div>';
    ['A', 'B'].forEach(k => {
      $('recSearch' + k).oninput = e => { recSearch[k] = e.target.value; renderRecLists(); };
    });
    renderRecLists();
  }

  function renderRecLists() {
    const r = result;
    ['A', 'B'].forEach(k => {
      const other = k === 'A' ? 'B' : 'A';
      const list = r['only' + k];
      const selOther = sel[other] && r['only' + other].find(x => x.uid === sel[other]);
      const q = recSearch[k].trim(), qn = normName(q), qi = normId(q);
      const queued = new Set(pending.map(p => p[k === 'A' ? 'a' : 'b']));
      let items = list
        .filter(x => !queued.has(x.uid))
        .filter(x => !q || normName(x.name).includes(qn) || normId(x.rawId).includes(qi))
        .map(x => ({ x, sim: selOther ? similarity(normName(x.name), normName(selOther.name)) : null }));
      if (selOther) items.sort((p, q2) => q2.sim - p.sim);
      $('recCnt' + k).textContent = list.length - queued.size;
      $('recList' + k).innerHTML = items.length
        ? items.map(({ x, sim }) => '<div class="rec-item' + (sel[k] === x.uid ? ' sel' : '') + '" data-side="' + k + '" data-uid="' + x.uid + '">' +
            '<span class="rid">' + esc(idText(x)) + '</span><span class="rname">' + esc(x.name) + '</span>' +
            (sim != null ? '<span class="tag rsim ' + (sim >= 80 ? 's-ok' : sim >= 50 ? 's-warn' : 's-bad') + '">' + sim + '%</span>' : '') + '</div>').join('')
        : '<div class="empty">' + (list.length ? 'لا توجد نتائج للبحث' : '✅ لا يوجد باقي') + '</div>';
      $('recList' + k).querySelectorAll('.rec-item').forEach(el => el.onclick = () => {
        const uid = +el.dataset.uid;
        sel[k] = sel[k] === uid ? null : uid;
        if (sel.A && sel.B) queueSelection();   // name + its match = one pair in the queue
        renderRecLists();
      });
    });
    renderRecBar();
  }

  function renderRecBar() {
    const r = result;
    const a = r.onlyA.find(x => x.uid === sel.A), b = r.onlyB.find(x => x.uid === sel.B);
    const show = (x, label) => esc(label) + ': ' + (x ? '<b>' + esc(x.name) + '</b> (' + esc(idText(x)) + ')' : '<span style="color:var(--muted)">لم يتم الاختيار</span>');
    const rows = pending.map(p => ({ p, a: r.onlyA.find(x => x.uid === p.a), b: r.onlyB.find(x => x.uid === p.b) }));

    let html = '<div class="pick">' + (a || b
      ? show(a, r.labelA) + '<br>' + show(b, r.labelB) + '<br><span style="color:var(--muted);font-size:12px">اختر الاسم المشابه من الجهة الأخرى ليُضاف إلى قائمة الربط</span>'
      : '<span style="color:var(--muted)">اختر اسماً من أي جهة ثم اختر المشابه له من الجهة الأخرى — يُضاف الزوج إلى قائمة الربط. كرر لأكثر من اسم ثم اضغط «موافقة وربط».</span>') + '</div>' +
      '<button class="btn-bad" id="markMissing"' + (a || b ? '' : ' disabled') + '>✖ غير موجود فعلاً</button>' +
      '<button class="btn-light" id="clearSel"' + (a || b ? '' : ' disabled') + '>إلغاء التحديد</button>';

    if (rows.length) {
      html += '<div style="flex-basis:100%"></div><div class="pending">' +
        '<div class="pending-head"><b>قائمة الربط (' + rows.length + ')</b>' +
        '<span><button class="btn-light btn-sm" id="allExact">الكل تام</button> <button class="btn-light btn-sm" id="allPartial">الكل جزئي</button></span></div>' +
        '<div class="pending-list"><table><thead><tr><th>#</th><th>' + esc(r.labelA) + '</th><th>' + esc(r.labelB) + '</th><th>التشابه</th><th>نوع الربط</th><th></th></tr></thead><tbody>' +
        rows.map(({ p, a, b }, i) => {
          const sim = similarity(normName(a.name), normName(b.name));
          return '<tr><td class="num">' + (i + 1) + '</td>' +
            '<td>' + esc(a.name) + ' <span style="color:var(--muted)">(' + esc(idText(a)) + ')</span></td>' +
            '<td>' + esc(b.name) + ' <span style="color:var(--muted)">(' + esc(idText(b)) + ')</span></td>' +
            '<td><span class="tag ' + (sim >= 80 ? 's-ok' : sim >= 50 ? 's-warn' : 's-bad') + '">' + sim + '%</span></td>' +
            '<td><select data-ptype="' + i + '"><option value="exact"' + (p.type === 'exact' ? ' selected' : '') + '>✔ تام</option>' +
            '<option value="partial"' + (p.type === 'partial' ? ' selected' : '') + '>≈ جزئي</option></select></td>' +
            '<td><button class="btn-light btn-sm" data-premove="' + i + '" title="إزالة من القائمة">✕</button></td></tr>';
        }).join('') + '</tbody></table></div>' +
        '<div class="pending-actions"><button class="btn-ok" id="approveAll">✔ موافقة وربط الكل (' + rows.length + ')</button>' +
        '<button class="btn-light" id="clearPending">إفراغ القائمة</button></div></div>';
    }
    $('recBar').innerHTML = html;

    $('markMissing').onclick = markSelectedMissing;
    $('clearSel').onclick = () => { sel.A = sel.B = null; renderRecLists(); };
    if (!rows.length) return;
    $('allExact').onclick = () => { pending.forEach(p => p.type = 'exact'); renderRecBar(); };
    $('allPartial').onclick = () => { pending.forEach(p => p.type = 'partial'); renderRecBar(); };
    $('approveAll').onclick = approvePending;
    $('clearPending').onclick = () => { pending = []; renderRecLists(); };
    $('recBar').querySelectorAll('[data-ptype]').forEach(el => el.onchange = () => { pending[+el.dataset.ptype].type = el.value; });
    $('recBar').querySelectorAll('[data-premove]').forEach(el => el.onclick = () => { pending.splice(+el.dataset.premove, 1); renderRecLists(); });
  }

  // ---------- Print ----------
  function printReports(keys) {
    const prevView = currentView;
    if (keys) {
      // Render all so any requested report is present, then hide the others while printing
      currentView = 'all';
      renderReports();
      document.querySelectorAll('.report').forEach(el => el.classList.toggle('print-skip', !keys.includes(el.dataset.key)));
    }
    window.print();
    currentView = prevView;
    renderReports();
  }

  const currentKeys = () => currentView === 'all' ? null : currentView === 'reconcile' ? ['onlyA', 'onlyB'] : [currentView];

  // ---------- Export ----------
  function exportReports(keys) {
    const wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };
    const defs = reportDefs().filter(d => !keys || keys.includes(d.key));
    const used = new Set();
    defs.forEach(d => {
      const data = [d.cols].concat(d.items.map(d.plain));
      const ws = XLSX.utils.aoa_to_sheet(data);
      ws['!cols'] = d.cols.map((c, i) => ({ wch: i === 0 ? 14 : 30 }));
      let name = d.title.replace(/[\\\/\?\*\[\]:]/g, '').slice(0, 31);
      while (used.has(name)) name = name.slice(0, 29) + '_' + used.size;
      used.add(name);
      XLSX.utils.book_append_sheet(wb, ws, name);
    });
    const suffix = keys && keys.length === 1 ? '_' + defs[0].title : '';
    XLSX.writeFile(wb, ('مقارنة_' + result.labelA + '_' + result.labelB + suffix).replace(/[\\\/\?\*\[\]:\s]+/g, '_') + '.xlsx');
  }

  // ---------- JSON save / load ----------
  function saveJson() {
    const payload = {
      app: 'excel-compare', version: 1,
      labelA: $('nameA').value, labelB: $('nameB').value,
      options: { arabic: $('optArabic').checked, spaces: $('optSpaces').checked, caseI: $('optCase').checked, zeros: $('optZeros').checked, noIdName: $('optNoIdName').checked },
      fileA: files.A.rows.length ? { fileName: files.A.fileName, data: extract('A') } : null,
      fileB: files.B.rows.length ? { fileName: files.B.fileName, data: extract('B') } : null,
      result
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'مقارنة_' + ($('nameA').value || 'A') + '_' + ($('nameB').value || 'B') + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function loadJson(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const p = JSON.parse(e.target.result);
        if (p.app !== 'excel-compare') throw new Error('ملف JSON غير متوافق');
        $('nameA').value = p.labelA || ''; $('nameB').value = p.labelB || '';
        if (p.options) {
          $('optArabic').checked = !!p.options.arabic; $('optSpaces').checked = !!p.options.spaces;
          $('optCase').checked = !!p.options.caseI; $('optZeros').checked = !!p.options.zeros; $('optNoIdName').checked = p.options.noIdName !== false;
        }
        // Rebuild in-memory sheets from saved ID/name data so comparison can be re-run
        ['A', 'B'].forEach(k => {
          const src = p['file' + k];
          if (!src) return;
          const rows = [['ID', 'Name']].concat(src.data.map(d => [d.rawId, d.name]));
          const ws = XLSX.utils.aoa_to_sheet(rows);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Data');
          files[k].workbook = wb; files[k].fileName = src.fileName;
          const sel = $('sheet' + k); sel.innerHTML = ''; sel.add(new Option('Data', 'Data'));
          $('cols' + k).classList.remove('hidden');
          loadSheet(k);
        });
        if (p.result) { result = p.result; sel.A = sel.B = null; pending = []; currentView = 'all'; tidy(); render(); }
      } catch (err) {
        alert('تعذر فتح ملف JSON: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  // ---------- Wiring ----------
  ['A', 'B'].forEach(k => {
    $('file' + k).addEventListener('change', e => { handleFile(k, e.target.files[0]); e.target.value = ''; });
    $('sheet' + k).addEventListener('change', () => loadSheet(k));
  });
  $('compareBtn').onclick = compare;
  $('search').oninput = renderReports;
  $('printCurrent').onclick = () => printReports(currentKeys());
  $('printAll').onclick = () => printReports(reportDefs().map(d => d.key));
  $('exportCurrent').onclick = () => exportReports(currentKeys());
  $('reports').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.act) doAction(b.dataset.act, +b.dataset.uid);
    else if (b.dataset.print) printReports([b.dataset.print]);
    else if (b.dataset.export) exportReports([b.dataset.export]);
  });
  $('exportAll').onclick = () => exportReports(null);
  $('saveJsonBtn').onclick = saveJson;
  $('loadJson').addEventListener('change', e => { if (e.target.files[0]) loadJson(e.target.files[0]); e.target.value = ''; });
})();
</script>
</body>
</html>
