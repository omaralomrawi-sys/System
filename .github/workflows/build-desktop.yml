name: Build ID Print (Windows exe)
on:
  workflow_dispatch:
  push:
    paths: ['id-print/**']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build exe
        working-directory: id-print/desktop
        run: |
          npm install
          npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ID-Print-windows
          path: id-print/desktop/dist/ID-Print.exe
